<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">标准 FFN 与 SwiGLU：两种中间特征加工方式</title><desc id="desc">标准 FFN 有两个投影；SwiGLU 有门控和内容两个上投影，逐元素乘积后下投影。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#63758b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#23344d} .line{stroke:#63758b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<rect width="1200" height="650" fill="#f7f9fc"/>
<text x="600" y="48" text-anchor="middle" font-size="29" font-weight="bold">标准 FFN 与 SwiGLU：两种中间特征加工方式</text>
<text x="600" y="82" text-anchor="middle" font-size="17">每个方框中的维度都针对一个 token；批量计算时在前面加上 [B, S]</text>
<text x="160" y="128" text-anchor="middle" font-size="22">标准 FFN：2 个矩阵</text>
<rect x="45" y="155" width="120" height="80" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="105.0" y="192.0" text-anchor="middle" font-size="20">输入</text>
<text x="105.0" y="220.0" text-anchor="middle" font-size="16">D</text>
<rect x="215" y="155" width="190" height="80" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="310.0" y="192.0" text-anchor="middle" font-size="20">Up 投影</text>
<text x="310.0" y="220.0" text-anchor="middle" font-size="16">D → M</text>
<rect x="455" y="155" width="175" height="80" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="542.5" y="192.0" text-anchor="middle" font-size="20">GELU / ReLU</text>
<text x="542.5" y="220.0" text-anchor="middle" font-size="16">M → M</text>
<rect x="680" y="155" width="190" height="80" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="775.0" y="192.0" text-anchor="middle" font-size="20">Down 投影</text>
<text x="775.0" y="220.0" text-anchor="middle" font-size="16">M → D</text>
<rect x="920" y="155" width="200" height="80" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="1020.0" y="192.0" text-anchor="middle" font-size="20">输出</text>
<text x="1020.0" y="220.0" text-anchor="middle" font-size="16">D</text>
<path d="M165 195H205" class="line"/>
<path d="M405 195H445" class="line"/>
<path d="M630 195H670" class="line"/>
<path d="M870 195H910" class="line"/>
<text x="175" y="303" text-anchor="middle" font-size="22">SwiGLU：3 个矩阵</text>
<rect x="45" y="398" width="120" height="80" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="105.0" y="435.0" text-anchor="middle" font-size="20">输入</text>
<text x="105.0" y="463.0" text-anchor="middle" font-size="16">D</text>
<rect x="240" y="330" width="200" height="80" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="340.0" y="367.0" text-anchor="middle" font-size="20">Gate 投影</text>
<text x="340.0" y="395.0" text-anchor="middle" font-size="16">D → M</text>
<rect x="485" y="330" width="155" height="80" rx="12" fill="#f1eafa" stroke="#bccbdf"/>
<text x="562.5" y="367.0" text-anchor="middle" font-size="20">SiLU</text>
<text x="562.5" y="395.0" text-anchor="middle" font-size="16">M → M</text>
<rect x="240" y="495" width="200" height="80" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="340.0" y="532.0" text-anchor="middle" font-size="20">Up 投影</text>
<text x="340.0" y="560.0" text-anchor="middle" font-size="16">D → M</text>
<rect x="690" y="398" width="140" height="80" rx="12" fill="#f1eafa" stroke="#bccbdf"/>
<text x="760.0" y="435.0" text-anchor="middle" font-size="20">逐元素 ×</text>
<text x="760.0" y="463.0" text-anchor="middle" font-size="16">M</text>
<rect x="880" y="398" width="160" height="80" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="960.0" y="435.0" text-anchor="middle" font-size="20">Down 投影</text>
<text x="960.0" y="463.0" text-anchor="middle" font-size="16">M → D</text>
<rect x="1080" y="398" width="95" height="80" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="1127.5" y="435.0" text-anchor="middle" font-size="20">输出</text>
<text x="1127.5" y="463.0" text-anchor="middle" font-size="16">D</text>
<path d="M165 438H200V370H230" class="line"/>
<path d="M200 438V535H230" class="line"/>
<path d="M440 370H475" class="line"/>
<path d="M640 370H760V388" class="line"/>
<path d="M440 535H760V488" class="line"/>
<path d="M830 438H870" class="line"/>
<path d="M1040 438H1070" class="line"/>
<text x="620" y="612" text-anchor="middle" font-size="18">SiLU(Gate) 可以为负或大于 1；两条分支的形状必须一致才能逐元素相乘</text>
</svg>

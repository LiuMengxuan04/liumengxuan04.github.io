<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Attention 汇聚上下文，FFN 逐位置加工</title><desc id="desc">简化子模块数据流，省略 Norm 和残差；因果 Attention 只访问当前及历史位置，同一层 FFN 权重在所有 token 间共享。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#63758b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#23344d} .line{stroke:#63758b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<rect width="1200" height="560" fill="#f7f9fc"/>
<text x="600" y="48" text-anchor="middle" font-size="29" font-weight="bold">Attention 汇聚上下文，FFN 逐位置加工</text>
<text x="600" y="83" text-anchor="middle" font-size="17">下图省略 Norm 和残差，仅突出 token 之间是否发生交互</text>
<rect x="55" y="110" width="190" height="55" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="150.0" y="144.5" text-anchor="middle" font-size="20">位置 1</text>
<rect x="40" y="250" width="220" height="65" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="150.0" y="289.5" text-anchor="middle" font-size="20">上下文表示 h</text>
<rect x="40" y="370" width="220" height="75" rx="12" fill="#e5f3ed" stroke="#bccbdf"/>
<text x="150.0" y="404.5" text-anchor="middle" font-size="20">同一个 FFN</text>
<text x="150.0" y="432.5" text-anchor="middle" font-size="16">共享 θ，逐 token 计算</text>
<path d="M150 315V360" class="line"/>
<path d="M150 445V480" class="line"/>
<rect x="55" y="488" width="190" height="48" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="150.0" y="519.0" text-anchor="middle" font-size="20">输出：D 维</text>
<rect x="505" y="110" width="190" height="55" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="600.0" y="144.5" text-anchor="middle" font-size="20">位置 2</text>
<rect x="490" y="250" width="220" height="65" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="600.0" y="289.5" text-anchor="middle" font-size="20">上下文表示 h</text>
<rect x="490" y="370" width="220" height="75" rx="12" fill="#e5f3ed" stroke="#bccbdf"/>
<text x="600.0" y="404.5" text-anchor="middle" font-size="20">同一个 FFN</text>
<text x="600.0" y="432.5" text-anchor="middle" font-size="16">共享 θ，逐 token 计算</text>
<path d="M600 315V360" class="line"/>
<path d="M600 445V480" class="line"/>
<rect x="505" y="488" width="190" height="48" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="600.0" y="519.0" text-anchor="middle" font-size="20">输出：D 维</text>
<rect x="955" y="110" width="190" height="55" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="1050.0" y="144.5" text-anchor="middle" font-size="20">位置 3</text>
<rect x="940" y="250" width="220" height="65" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="1050.0" y="289.5" text-anchor="middle" font-size="20">上下文表示 h</text>
<rect x="940" y="370" width="220" height="75" rx="12" fill="#e5f3ed" stroke="#bccbdf"/>
<text x="1050.0" y="404.5" text-anchor="middle" font-size="20">同一个 FFN</text>
<text x="1050.0" y="432.5" text-anchor="middle" font-size="16">共享 θ，逐 token 计算</text>
<path d="M1050 315V360" class="line"/>
<path d="M1050 445V480" class="line"/>
<rect x="955" y="488" width="190" height="48" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="1050.0" y="519.0" text-anchor="middle" font-size="20">输出：D 维</text>
<path d="M150 165L150 240" class="line"/>
<path d="M150 165L600 240" class="line"/>
<path d="M600 165L600 240" class="line"/>
<path d="M150 165L1050 240" class="line"/>
<path d="M600 165L1050 240" class="line"/>
<path d="M1050 165L1050 240" class="line"/>
<rect x="490" y="197" width="220" height="32" rx="8" fill="#f7f9fc"/>
<text x="600" y="220" text-anchor="middle" font-size="18">因果 Attention</text>
<text x="375" y="348" text-anchor="middle" font-size="17">FFN 不直接读取其他位置的向量</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MHA 与 MLA 的缓存方式对比</title>
  <desc id="desc">MHA 缓存展开后的多个 K/V heads，MLA 将隐藏状态下投影成共享的低维潜在向量并缓存。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526b88"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:42px;font-weight:800;fill:#17233a}.sub{font-size:20px;fill:#56647a}.head{font-size:29px;font-weight:750;fill:#17233a}.label{font-size:20px;font-weight:700;fill:#263750}.small{font-size:17px;fill:#56647a}.panel{fill:#fff;stroke:#d2d9e3;stroke-width:2}.node{fill:#e8f1fb;stroke:#4b78a8;stroke-width:2}.cache{fill:#eaf4eb;stroke:#4d8a61;stroke-width:2}.latent{fill:#fff0df;stroke:#ba7030;stroke-width:2}.line{stroke:#526b88;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <text x="800" y="62" text-anchor="middle" class="title">MLA：不缓存展开后的完整多头 K/V</text>
  <text x="800" y="100" text-anchor="middle" class="sub">同一个 token、同一层的状态保存方式</text>
  <rect x="60" y="145" width="1480" height="285" rx="16" class="panel"/>
  <text x="95" y="195" class="head">MHA：先展开，再全部保存</text>
  <rect x="115" y="255" width="190" height="85" rx="10" class="node"/><text x="210" y="290" text-anchor="middle" class="label">隐藏状态 hₜ</text><text x="210" y="318" text-anchor="middle" class="small">维度 H</text>
  <path d="M325 298H445" class="line"/><rect x="465" y="235" width="220" height="125" rx="10" class="node"/><text x="575" y="275" text-anchor="middle" class="label">Wₖ、Wᵥ</text><text x="575" y="307" text-anchor="middle" class="small">直接投影</text><text x="575" y="335" text-anchor="middle" class="small">2 × Nₕ × Dₕ</text>
  <path d="M705 298H825" class="line"/><g class="cache"><rect x="845" y="205" width="110" height="70" rx="8"/><rect x="970" y="205" width="110" height="70" rx="8"/><rect x="1095" y="205" width="110" height="70" rx="8"/><rect x="1220" y="205" width="110" height="70" rx="8"/><rect x="845" y="300" width="110" height="70" rx="8"/><rect x="970" y="300" width="110" height="70" rx="8"/><rect x="1095" y="300" width="110" height="70" rx="8"/><rect x="1220" y="300" width="110" height="70" rx="8"/></g><text x="900" y="248" text-anchor="middle" class="label">K1</text><text x="1025" y="248" text-anchor="middle" class="label">K2</text><text x="1150" y="248" text-anchor="middle" class="label">...</text><text x="1275" y="248" text-anchor="middle" class="label">KN</text><text x="900" y="343" text-anchor="middle" class="label">V1</text><text x="1025" y="343" text-anchor="middle" class="label">V2</text><text x="1150" y="343" text-anchor="middle" class="label">...</text><text x="1275" y="343" text-anchor="middle" class="label">VN</text><text x="1390" y="292" text-anchor="middle" class="small">全部写入</text><text x="1390" y="319" text-anchor="middle" class="small">KV Cache</text>
  <rect x="60" y="465" width="1480" height="330" rx="16" class="panel"/>
  <text x="95" y="515" class="head">MLA：先压缩，只保存共享 latent</text>
  <rect x="115" y="600" width="190" height="85" rx="10" class="node"/><text x="210" y="635" text-anchor="middle" class="label">隐藏状态 hₜ</text><text x="210" y="663" text-anchor="middle" class="small">维度 H</text>
  <path d="M325 643H445" class="line"/><rect x="465" y="580" width="220" height="125" rx="10" class="latent"/><text x="575" y="620" text-anchor="middle" class="label">下投影 WDKV</text><text x="575" y="652" text-anchor="middle" class="small">联合压缩 K/V</text><text x="575" y="680" text-anchor="middle" class="small">H → d꜀</text>
  <path d="M705 643H825" class="line"/><rect x="845" y="565" width="300" height="155" rx="12" class="cache"/><text x="995" y="612" text-anchor="middle" class="label">缓存 cₜᴷⱽ</text><text x="995" y="648" text-anchor="middle" class="head">d꜀ 个元素</text><text x="995" y="687" text-anchor="middle" class="small">多个 heads 共享一份底稿</text>
  <path d="M1165 643H1265" class="line"/><rect x="1285" y="590" width="195" height="105" rx="10" class="node"/><text x="1382" y="627" text-anchor="middle" class="label">按需参与</text><text x="1382" y="657" text-anchor="middle" class="small">Key 匹配</text><text x="1382" y="683" text-anchor="middle" class="small">Value 汇总</text>
  <text x="800" y="850" text-anchor="middle" class="sub">低秩表示是训练出来的共享信息通路，不是通用无损压缩文件</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2156c4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 46px; font-weight: 800; fill: #102a72; }
      .h2 { font-size: 25px; font-weight: 750; fill: #174ea6; }
      .label { font-size: 20px; font-weight: 700; fill: #17223b; }
      .small { font-size: 17px; fill: #35415c; }
      .formula { font-size: 23px; font-weight: 700; fill: #5b21b6; }
      .box { rx: 20; stroke-width: 2.4; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="68" text-anchor="middle" class="title">从 Logits 到训练 Loss 与下一个 Token</text>
  <text x="800" y="105" text-anchor="middle" class="small">Softmax 把分数变成概率；交叉熵在训练时评价正确答案；采样策略在推理时选择 token</text>

  <rect x="70" y="180" width="300" height="205" class="box" fill="#eef4ff" stroke="#2563eb"/>
  <text x="220" y="220" text-anchor="middle" class="h2">模型输出 Logits</text>
  <text x="220" y="260" text-anchor="middle" class="formula">z = [2, 1, 0]</text>
  <text x="105" y="307" class="small">苹果：2</text>
  <text x="105" y="338" class="small">香蕉：1</text>
  <text x="105" y="369" class="small">汽车：0</text>
  <text x="220" y="420" text-anchor="middle" class="small">任意实数，不是概率</text>

  <line x1="370" y1="280" x2="475" y2="280" stroke="#2156c4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="422" y="258" text-anchor="middle" class="label">Softmax</text>

  <rect x="490" y="180" width="360" height="270" class="box" fill="#f3edff" stroke="#7c3aed"/>
  <text x="670" y="220" text-anchor="middle" class="h2" fill="#5b21b6">词表概率分布 p</text>
  <text x="670" y="257" text-anchor="middle" class="formula">pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)</text>
  <text x="535" y="305" class="label">苹果</text><rect x="620" y="285" width="165" height="28" rx="8" fill="#d7c8ff"/><rect x="620" y="285" width="110" height="28" rx="8" fill="#7c3aed"/><text x="800" y="306" text-anchor="end" class="small">0.665</text>
  <text x="535" y="350" class="label">香蕉</text><rect x="620" y="330" width="165" height="28" rx="8" fill="#d7c8ff"/><rect x="620" y="330" width="40" height="28" rx="8" fill="#7c3aed"/><text x="800" y="351" text-anchor="end" class="small">0.245</text>
  <text x="535" y="395" class="label">汽车</text><rect x="620" y="375" width="165" height="28" rx="8" fill="#d7c8ff"/><rect x="620" y="375" width="15" height="28" rx="8" fill="#7c3aed"/><text x="800" y="396" text-anchor="end" class="small">0.090</text>
  <text x="670" y="434" text-anchor="middle" class="small">所有概率为正，且总和等于 1</text>

  <!-- Training branch -->
  <line x1="850" y1="255" x2="980" y2="205" stroke="#2156c4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="910" y="207" text-anchor="middle" class="label">训练</text>
  <rect x="995" y="135" width="525" height="245" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="1257" y="178" text-anchor="middle" class="h2" fill="#047857">交叉熵：正确 token 是“香蕉”</text>
  <text x="1257" y="220" text-anchor="middle" class="formula">L = −log p香蕉</text>
  <text x="1257" y="260" text-anchor="middle" class="formula">= −log(0.245) ≈ 1.41</text>
  <text x="1040" y="309" class="small">正确答案概率越高 → loss 越小</text>
  <text x="1040" y="341" class="small">正确答案概率越低 → loss 越大</text>
  <text x="1257" y="415" text-anchor="middle" class="small">loss 用于反向传播，更新模型参数</text>

  <!-- Inference branch -->
  <line x1="850" y1="365" x2="980" y2="510" stroke="#2156c4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="910" y="455" text-anchor="middle" class="label">推理</text>
  <rect x="995" y="470" width="525" height="260" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1257" y="514" text-anchor="middle" class="h2" fill="#9a3412">解码：怎样选下一个 token？</text>
  <text x="1040" y="563" class="label">Greedy</text><text x="1185" y="563" class="small">直接选择概率最大的 token</text>
  <text x="1040" y="607" class="label">Top-k</text><text x="1185" y="607" class="small">只保留概率最高的 k 个候选</text>
  <text x="1040" y="651" class="label">Top-p</text><text x="1185" y="651" class="small">保留累计概率达到 p 的最小集合</text>
  <text x="1257" y="698" text-anchor="middle" class="small">在候选集合中重新归一化并采样</text>

  <!-- Stable calculation strip -->
  <rect x="70" y="500" width="780" height="230" class="box" fill="#f8f6ff" stroke="#6d28d9"/>
  <text x="460" y="542" text-anchor="middle" class="h2" fill="#5b21b6">稳定计算：不用先得到极小概率再取 log</text>
  <text x="460" y="590" text-anchor="middle" class="formula">LSE(z) = m + log Σⱼ exp(zⱼ − m)</text>
  <text x="460" y="629" text-anchor="middle" class="small">m = maxⱼ zⱼ，使所有 exp(zⱼ−m) ≤ 1</text>
  <text x="460" y="677" text-anchor="middle" class="formula">log softmax(z)ᵢ = zᵢ − LSE(z)</text>
  <text x="460" y="714" text-anchor="middle" class="formula">CrossEntropy = LSE(z) − zᵧ</text>

  <rect x="245" y="790" width="1110" height="65" rx="17" fill="#fff3f1" stroke="#dc2626" stroke-width="2.2"/>
  <text x="800" y="831" text-anchor="middle" font-size="22" font-weight="750" fill="#b91c1c">训练通常直接从 logits 计算融合交叉熵；推理才需要把分布用于过滤和采样</text>
</svg>

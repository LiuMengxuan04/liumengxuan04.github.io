<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">同一个向量：移动中心，或缩小幅度</title><desc id="desc">四种颜色和编号对应四个特征；数轴展示原始值及两种归一化结果，gamma 为一，beta 为零，忽略 epsilon。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK JP","Microsoft YaHei",sans-serif;fill:#24354a} text.small{font-size:17px}</style><rect width="1000" height="550" fill="#f7f9fc"/>
<text x="500" y="48" text-anchor="middle" font-size="28" font-weight="bold">同一个向量：移动中心，或缩小幅度</text>
<text x="500" y="89" text-anchor="middle" font-size="18">示例 x = [1, 2, 3, 4]；γ = 1，β = 0，忽略 ε</text>
<text x="30" y="152" text-anchor="start" font-size="22">原始 x</text>

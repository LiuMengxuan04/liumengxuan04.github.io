<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
<title id="title">正弦位置编码与旋转位置编码 RoPE 的机制对照</title>
<desc id="desc">左栏正弦位置编码把位置向量加到投影之前的 embedding 上，右栏 RoPE 把二维旋转乘到投影之后的 Q、K 上；因此前者的位置项与绝对位置有关，后者只与相对位置有关。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8a99a8"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1a2733}.t{font-size:42px;font-weight:800;fill:#14202e}.s{font-size:21px;fill:#5c6b7c}.h{font-size:29px;font-weight:750;fill:#fff}.cap{font-size:17px;font-weight:700;fill:#5c6b7c;letter-spacing:.14em}.lbl{font-size:18px;fill:#5c6b7c}.chip{font-size:20px;font-weight:700;fill:#fff}.conc{font-size:26px;font-weight:750;fill:#fff}.note{font-size:18px;fill:#5c6b7c}</style></defs>
<rect width="1600" height="1020" fill="#f6f8fb"/>
<text x="800.0" y="66" text-anchor="middle" class="t">位置编码：加在输入上，还是乘在 Q、K 上</text>
<text x="800.0" y="104" text-anchor="middle" class="s">同一个问题，正弦位置编码与 RoPE 的两种解法</text>
<rect x="40" y="150" width="732" height="790" rx="16" fill="#ffffff" stroke="#d3dae3" stroke-width="2"/>
<rect x="40" y="150" width="732" height="76" rx="16" fill="#a33a29" stroke="none" stroke-width="0"/>
<rect x="40" y="210" width="732" height="16" rx="0" fill="#a33a29" stroke="none" stroke-width="0"/>
<text x="74" y="199" text-anchor="start" class="h">正弦位置编码</text>
<rect x="590" y="166" width="148" height="44" rx="22" fill="#ffffff" opacity=".18"/>
<text x="664.0" y="195" text-anchor="middle" class="chip">向量加法</text>
<text x="406.0" y="276" text-anchor="middle" class="cap">核心公式</text>
<text x="406.0" y="316" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:26px;fill:#16222f">PE(m, 2i) = sin(ω<tspan style="font-size:18px;baseline-shift:-8px">i</tspan> · m)</text>
<text x="406.0" y="360" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:26px;fill:#16222f">PE(m, 2i+1) = cos(ω<tspan style="font-size:18px;baseline-shift:-8px">i</tspan> · m)</text>
<text x="406.0" y="430" text-anchor="middle" class="cap">注入阶段</text>
<rect x="106.0" y="470" width="108" height="60" rx="10" fill="#ffffff" stroke="#d3dae3" stroke-width="2"/>
<text x="160.0" y="508.0" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#2a3a4c">x<tspan style="font-size:16px;baseline-shift:-7px">m</tspan></text>
<rect x="246.0" y="470" width="168" height="60" rx="10" fill="#fbeae5" stroke="#a33a29" stroke-width="2"/>
<text x="330.0" y="508.0" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#a33a29">+ PE(m)</text>
<rect x="446.0" y="470" width="120" height="60" rx="10" fill="#ffffff" stroke="#d3dae3" stroke-width="2"/>
<text x="506.0" y="508.0" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#2a3a4c">W<tspan style="font-size:16px;baseline-shift:-7px">Q</tspan></text>
<rect x="598.0" y="470" width="108" height="60" rx="10" fill="#ffffff" stroke="#d3dae3" stroke-width="2"/>
<text x="652.0" y="508.0" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#2a3a4c">q<tspan style="font-size:16px;baseline-shift:-7px">m</tspan></text>
<path d="M218.0 500.0L241.0 500.0" stroke="#8a99a8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M418.0 500.0L441.0 500.0" stroke="#8a99a8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M570.0 500.0L593.0 500.0" stroke="#8a99a8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text x="406.0" y="576" text-anchor="middle" class="lbl">位置向量加在投影之前</text>
<text x="406.0" y="634" text-anchor="middle" class="cap">q、k 的写法</text>
<text x="406.0" y="682" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:26px;fill:#16222f">q<tspan style="font-size:18px;baseline-shift:-8px">m</tspan> = W<tspan style="font-size:18px;baseline-shift:-8px">Q</tspan>(x<tspan style="font-size:18px;baseline-shift:-8px">m</tspan> + PE(m))</text>
<text x="406.0" y="722" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:26px;fill:#16222f">k<tspan style="font-size:18px;baseline-shift:-8px">n</tspan> = W<tspan style="font-size:18px;baseline-shift:-8px">K</tspan>(x<tspan style="font-size:18px;baseline-shift:-8px">n</tspan> + PE(n))</text>
<text x="406.0" y="768" text-anchor="middle" class="cap">内积中的位置项</text>
<text x="406.0" y="816" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:26px;fill:#16222f">PE(m)<tspan style="font-size:18px;baseline-shift:9px">T</tspan> PE(n) = Σ<tspan style="font-size:18px;baseline-shift:-8px">i</tspan> cos(ω<tspan style="font-size:18px;baseline-shift:-8px">i</tspan> (n − m))</text>
<rect x="74" y="854" width="664" height="62" rx="10" fill="#7a2618" stroke="none" stroke-width="0"/>
<text x="406.0" y="895" text-anchor="middle" class="conc">和绝对位置 m、n 有关</text>
<rect x="828" y="150" width="732" height="790" rx="16" fill="#ffffff" stroke="#d3dae3" stroke-width="2"/>
<rect x="828" y="150" width="732" height="76" rx="16" fill="#2c6ba6" stroke="none" stroke-width="0"/>
<rect x="828" y="210" width="732" height="16" rx="0" fill="#2c6ba6" stroke="none" stroke-width="0"/>
<text x="862" y="199" text-anchor="start" class="h">旋转位置编码 RoPE</text>
<rect x="1378" y="166" width="148" height="44" rx="22" fill="#ffffff" opacity=".18"/>
<text x="1452.0" y="195" text-anchor="middle" class="chip">矩阵乘法</text>
<text x="1194.0" y="276" text-anchor="middle" class="cap">核心公式</text>
<text x="1032.0" y="329" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:26px;fill:#16222f">RoPE(m, i) =</text>
<rect x="1143.0" y="258" width="326" height="124" rx="8" fill="#e7f0fa" stroke="none" stroke-width="0"/>
<text x="1235.0" y="297" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#16222f">cos(ω<tspan style="font-size:16px;baseline-shift:-7px">i</tspan>m)</text>
<text x="1385.0" y="297" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#16222f">−sin(ω<tspan style="font-size:16px;baseline-shift:-7px">i</tspan>m)</text>
<text x="1235.0" y="349" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#16222f">sin(ω<tspan style="font-size:16px;baseline-shift:-7px">i</tspan>m)</text>
<text x="1385.0" y="349" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#16222f">cos(ω<tspan style="font-size:16px;baseline-shift:-7px">i</tspan>m)</text>
<path d="M1310.0 264L1310.0 368" stroke="#b9cde0" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M1153.0 262H1143.0V370H1153.0" fill="none" stroke="#2c6ba6" stroke-width="3"/>
<path d="M1467.0 262H1477.0V370H1467.0" fill="none" stroke="#2c6ba6" stroke-width="3"/>
<text x="1194.0" y="430" text-anchor="middle" class="cap">注入阶段</text>
<rect x="871.0" y="470" width="92" height="60" rx="10" fill="#ffffff" stroke="#d3dae3" stroke-width="2"/>
<text x="917.0" y="508.0" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#2a3a4c">x<tspan style="font-size:16px;baseline-shift:-7px">m</tspan></text>
<rect x="989.0" y="470" width="104" height="60" rx="10" fill="#ffffff" stroke="#d3dae3" stroke-width="2"/>
<text x="1041.0" y="508.0" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#2a3a4c">W<tspan style="font-size:16px;baseline-shift:-7px">Q</tspan></text>
<rect x="1119.0" y="470" width="92" height="60" rx="10" fill="#ffffff" stroke="#d3dae3" stroke-width="2"/>
<text x="1165.0" y="508.0" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#2a3a4c">q<tspan style="font-size:16px;baseline-shift:-7px">m</tspan></text>
<rect x="1237.0" y="470" width="150" height="60" rx="10" fill="#e7f0fa" stroke="#2c6ba6" stroke-width="2"/>
<text x="1312.0" y="508.0" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#2c6ba6">RoPE(m)</text>
<rect x="1413.0" y="470" width="104" height="60" rx="10" fill="#ffffff" stroke="#d3dae3" stroke-width="2"/>
<text x="1465.0" y="508.0" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:23px;fill:#2a3a4c">q&#x27;<tspan style="font-size:16px;baseline-shift:-7px">m</tspan></text>
<path d="M967.0 500.0L984.0 500.0" stroke="#8a99a8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M1097.0 500.0L1114.0 500.0" stroke="#8a99a8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M1215.0 500.0L1232.0 500.0" stroke="#8a99a8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<path d="M1391.0 500.0L1408.0 500.0" stroke="#8a99a8" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text x="1194.0" y="576" text-anchor="middle" class="lbl">位置旋转加在投影之后</text>
<text x="1194.0" y="634" text-anchor="middle" class="cap">q、k 的写法</text>
<text x="1194.0" y="682" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:26px;fill:#16222f">q&#x27;<tspan style="font-size:18px;baseline-shift:-8px">m</tspan> = RoPE(m) (W<tspan style="font-size:18px;baseline-shift:-8px">Q</tspan> x<tspan style="font-size:18px;baseline-shift:-8px">m</tspan>)</text>
<text x="1194.0" y="722" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:26px;fill:#16222f">k&#x27;<tspan style="font-size:18px;baseline-shift:-8px">n</tspan> = RoPE(n) (W<tspan style="font-size:18px;baseline-shift:-8px">K</tspan> x<tspan style="font-size:18px;baseline-shift:-8px">n</tspan>)</text>
<text x="1194.0" y="768" text-anchor="middle" class="cap">内积中的位置项</text>
<text x="1194.0" y="816" text-anchor="middle" style="font-family:Cambria,'Times New Roman',Georgia,serif;font-size:26px;fill:#16222f">RoPE(m)<tspan style="font-size:18px;baseline-shift:9px">T</tspan> RoPE(n) = RoPE(n − m)</text>
<rect x="862" y="854" width="664" height="62" rx="10" fill="#1f4d7c" stroke="none" stroke-width="0"/>
<text x="1194.0" y="895" text-anchor="middle" class="conc">只和相对位置 n − m 有关</text>
<text x="800.0" y="980" text-anchor="middle" class="note">注：左栏“内积中的位置项”是化简写法，真实点积中还夹着投影矩阵，前三项仍依赖绝对位置；右栏则是严格成立的恒等式</text>
</svg>

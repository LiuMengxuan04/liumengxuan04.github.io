<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="title desc">
<title id="title">最后位置的隐藏向量经过 LM Head 预测下一个 token</title><desc id="desc">Prefill 经过全部 Block 和最终归一化得到三行隐藏状态，取人的一行。三维隐藏向量二一负一与三乘四权重相乘，得到民工们生的分数四二一负三，贪心选择民。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#24354a;font-size:23px}.title{font-size:29px;font-weight:700}.small{font-size:21px}.note{font-size:21px;fill:#526479}.old{fill:#e4eaf1}.new{fill:#f8dfbf}.score{fill:#f8d4d4}.result{fill:#ccece6}.line{fill:none;stroke:#687d94;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#687d94"/></marker></defs>
<rect width="900" height="780" fill="#f7f9fc"/>
<text x="450" y="44" text-anchor="middle" class="title">最后位置 → 词表打分 → 下一个 token</text>
<text x="450" y="84" text-anchor="middle" class="note">已完成全部 Transformer Block 和最终归一化</text>
<text x="180" y="130" text-anchor="middle" class="small">最终隐藏矩阵 [3, H]</text>
<rect x="65" y="155" width="230" height="52" rx="7" class="old"/>
<text x="180.0" y="189.0" text-anchor="middle" class="">h 中</text>
<rect x="65" y="217" width="230" height="52" rx="7" class="old"/>
<text x="180.0" y="251.0" text-anchor="middle" class="">h 华</text>
<rect x="65" y="279" width="230" height="52" rx="7" class="new"/>
<text x="180.0" y="313.0" text-anchor="middle" class="">h 人</text>
<path d="M300,305 H390" class="line"/>
<rect x="410" y="279" width="390" height="52" rx="7" class="new"/>
<text x="605.0" y="313.0" text-anchor="middle" class="">h_last：取最后一个有效位置</text>
<text x="610" y="242" text-anchor="middle" class="small">按序列位置取行，不是取某一层</text>
<text x="450" y="380" text-anchor="middle" class="small">手算示例：H = 3，词表只有 4 个候选</text>
<rect x="40" y="462" width="180" height="60" rx="7" class="new"/>
<text x="130.0" y="500.0" text-anchor="middle" class="">[2, 1, −1]</text>
<text x="252" y="499" text-anchor="middle" class="">×</text>
<text x="324" y="425" text-anchor="middle" class="small">民</text>
<rect x="295" y="443" width="58" height="34" rx="7" class="new"/>
<text x="324.0" y="468.0" text-anchor="middle" class="">1</text>
<rect x="295" y="483" width="58" height="34" rx="7" class="new"/>
<text x="324.0" y="508.0" text-anchor="middle" class="">1</text>
<rect x="295" y="523" width="58" height="34" rx="7" class="new"/>
<text x="324.0" y="548.0" text-anchor="middle" class="">-1</text>
<text x="394" y="425" text-anchor="middle" class="small">工</text>
<rect x="365" y="443" width="58" height="34" rx="7" class="old"/>
<text x="394.0" y="468.0" text-anchor="middle" class="">0</text>
<rect x="365" y="483" width="58" height="34" rx="7" class="old"/>
<text x="394.0" y="508.0" text-anchor="middle" class="">2</text>
<rect x="365" y="523" width="58" height="34" rx="7" class="old"/>
<text x="394.0" y="548.0" text-anchor="middle" class="">0</text>
<text x="464" y="425" text-anchor="middle" class="small">们</text>
<rect x="435" y="443" width="58" height="34" rx="7" class="old"/>
<text x="464.0" y="468.0" text-anchor="middle" class="">1</text>
<rect x="435" y="483" width="58" height="34" rx="7" class="old"/>
<text x="464.0" y="508.0" text-anchor="middle" class="">0</text>
<rect x="435" y="523" width="58" height="34" rx="7" class="old"/>
<text x="464.0" y="548.0" text-anchor="middle" class="">1</text>
<text x="534" y="425" text-anchor="middle" class="small">生</text>
<rect x="505" y="443" width="58" height="34" rx="7" class="old"/>
<text x="534.0" y="468.0" text-anchor="middle" class="">-1</text>
<rect x="505" y="483" width="58" height="34" rx="7" class="old"/>
<text x="534.0" y="508.0" text-anchor="middle" class="">0</text>
<rect x="505" y="523" width="58" height="34" rx="7" class="old"/>
<text x="534.0" y="548.0" text-anchor="middle" class="">1</text>
<text x="612" y="499" text-anchor="middle" class="">=</text>
<rect x="642" y="462" width="230" height="60" rx="7" class="result"/>
<text x="757.0" y="500.0" text-anchor="middle" class="">[4, 2, 1, −3]</text>
<text x="130" y="601" text-anchor="middle" class="small">h_last：[1, 3]</text>
<text x="430" y="601" text-anchor="middle" class="small">W_LM：[3, 4]</text>
<text x="754" y="601" text-anchor="middle" class="small">logits：[1, 4]</text>
<text x="450" y="650" text-anchor="middle" class="small">“民”的分数：2×1 + 1×1 + (−1)×(−1) = 4</text>
<rect x="220" y="677" width="460" height="52" rx="7" class="result"/>
<text x="450.0" y="711.0" text-anchor="middle" class="">贪心解码：选最高分，对应“民”</text>
<text x="450" y="765" text-anchor="middle" class="note">下一轮输入“民”时，才会计算并缓存它的 K/V</text>
</svg>

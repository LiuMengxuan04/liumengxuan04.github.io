<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" role="img" aria-labelledby="title desc">
<title id="title">当前 Query 只计算一行新的 Attention 分数</title><desc id="desc">中和华的 K/V 已缓存，人的 Q/K/V 本轮计算。当前 Query 与完整 K 做点积，只得到一行三个分数，再通过 Softmax 对完整 V 加权。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#24354a;font-size:23px}.title{font-size:29px;font-weight:700}.small{font-size:21px}.note{font-size:21px;fill:#526479}.old{fill:#e4eaf1}.new{fill:#f8dfbf}.score{fill:#f8d4d4}.result{fill:#ccece6}.line{fill:none;stroke:#687d94;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#687d94"/></marker></defs>
<rect width="900" height="690" fill="#f7f9fc"/>
<text x="450" y="45" text-anchor="middle" class="title">当前 Query，只计算新的一行</text>
<text x="450" y="84" text-anchor="middle" class="note">灰色：历史缓存　橙色：本轮新算　粉色：本轮新分数</text>
<rect x="50" y="140" width="140" height="64" rx="7" class="new"/>
<text x="120.0" y="180.0" text-anchor="middle" class="">q 人</text>
<text x="225" y="183" text-anchor="middle" class="">×</text>
<rect x="270" y="140" width="150" height="64" rx="7" class="old"/>
<text x="345.0" y="180.0" text-anchor="middle" class="">k 中</text>
<rect x="440" y="140" width="150" height="64" rx="7" class="old"/>
<text x="515.0" y="180.0" text-anchor="middle" class="">k 华</text>
<rect x="610" y="140" width="150" height="64" rx="7" class="new"/>
<text x="685.0" y="180.0" text-anchor="middle" class="">k 人</text>
<text x="510" y="125" text-anchor="middle" class="small">完整 Kᵀ：历史缓存 + 当前 Key</text>
<text x="450" y="242" text-anchor="middle" class="note">[1, dₖ] × [dₖ, 3] → [1, 3]</text>
<path d="M450,255 V285" class="line"/>
<rect x="190" y="300" width="160" height="55" rx="7" class="score"/>
<text x="270.0" y="335.5" text-anchor="middle" class="">人/中</text>
<rect x="370" y="300" width="160" height="55" rx="7" class="score"/>
<text x="450.0" y="335.5" text-anchor="middle" class="">人/华</text>
<rect x="550" y="300" width="160" height="55" rx="7" class="score"/>
<text x="630.0" y="335.5" text-anchor="middle" class="">人/人</text>
<text x="450" y="390" text-anchor="middle" class="small">缩放 + Softmax：只在当前这行归一化</text>
<path d="M450,405 V440" class="line"/>
<rect x="190" y="455" width="160" height="55" rx="7" class="old"/>
<text x="270.0" y="490.5" text-anchor="middle" class="">v 中</text>
<rect x="370" y="455" width="160" height="55" rx="7" class="old"/>
<text x="450.0" y="490.5" text-anchor="middle" class="">v 华</text>
<rect x="550" y="455" width="160" height="55" rx="7" class="new"/>
<text x="630.0" y="490.5" text-anchor="middle" class="">v 人</text>
<text x="450" y="544" text-anchor="middle" class="small">用当前行的权重，对完整 V 加权汇总</text>
<path d="M450,557 V580" class="line"/>
<rect x="290" y="593" width="320" height="52" rx="7" class="result"/>
<text x="450.0" y="627.0" text-anchor="middle" class="">o 人：一个 head 的输出</text>
<text x="450" y="677" text-anchor="middle" class="note">历史分数行通常不缓存，也不参与本轮计算</text>
</svg>

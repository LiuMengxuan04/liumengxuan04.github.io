<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">四种历史 KV 保留方式</title><desc id="desc">完整注意力保留所有 token，滑动窗口保留最近 token，StreamingLLM 保留开头 sink 和最近 token，KV Pruning 动态保留高重要性 token。</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:42px;font-weight:800;fill:#17233a}.sub{font-size:20px;fill:#56647a}.head{font-size:27px;font-weight:750;fill:#17233a}.label{font-size:17px;font-weight:700;fill:#263750}.note{font-size:17px;fill:#56647a}.panel{fill:#fff;stroke:#d2d9e3;stroke-width:2}.keep{fill:#e8f1fb;stroke:#4b78a8;stroke-width:2}.recent{fill:#e9f4eb;stroke:#4d8a61;stroke-width:2}.sink{fill:#fff0df;stroke:#b86e30;stroke-width:2}.drop{fill:#eef1f4;stroke:#c4ccd6;stroke-width:1.5;opacity:.7}.important{fill:#f8e6e6;stroke:#a95858;stroke-width:2}.q{fill:#7657a8}.arrow{stroke:#7657a8;stroke-width:3}</style></defs>
  <rect width="1600" height="980" fill="#f7f8fa"/><text x="800" y="60" text-anchor="middle" class="title">减少 KV Cache 长度：留下哪些历史 token？</text><text x="800" y="98" text-anchor="middle" class="sub">每行右侧紫色节点是当前 Query；方块代表历史位置的 K/V</text>
  <g transform="translate(55 140)"><rect width="1490" height="180" rx="14" class="panel"/><text x="35" y="52" class="head">Full Attention</text><text x="35" y="84" class="note">全部保留、全部读取</text>
    <g transform="translate(355 52)"><rect x="0" width="85" height="72" rx="8" class="keep"/><rect x="100" width="85" height="72" rx="8" class="keep"/><rect x="200" width="85" height="72" rx="8" class="keep"/><rect x="300" width="85" height="72" rx="8" class="keep"/><rect x="400" width="85" height="72" rx="8" class="keep"/><rect x="500" width="85" height="72" rx="8" class="keep"/><rect x="600" width="85" height="72" rx="8" class="keep"/><rect x="700" width="85" height="72" rx="8" class="keep"/><rect x="800" width="85" height="72" rx="8" class="keep"/><rect x="900" width="85" height="72" rx="8" class="keep"/><text x="42" y="45" text-anchor="middle" class="label">1</text><text x="142" y="45" text-anchor="middle" class="label">2</text><text x="242" y="45" text-anchor="middle" class="label">3</text><text x="342" y="45" text-anchor="middle" class="label">4</text><text x="442" y="45" text-anchor="middle" class="label">5</text><text x="542" y="45" text-anchor="middle" class="label">6</text><text x="642" y="45" text-anchor="middle" class="label">7</text><text x="742" y="45" text-anchor="middle" class="label">8</text><text x="842" y="45" text-anchor="middle" class="label">9</text><text x="942" y="45" text-anchor="middle" class="label">10</text><line x1="995" y1="36" x2="1060" y2="36" class="arrow"/><circle cx="1100" cy="36" r="31" class="q"/><text x="1100" y="43" text-anchor="middle" fill="#fff" class="label">Q</text></g></g>
  <g transform="translate(55 345)"><rect width="1490" height="180" rx="14" class="panel"/><text x="35" y="52" class="head">Sliding Window</text><text x="35" y="84" class="note">只保留最近 4 个</text>
    <g transform="translate(355 52)"><rect x="0" width="85" height="72" rx="8" class="drop"/><rect x="100" width="85" height="72" rx="8" class="drop"/><rect x="200" width="85" height="72" rx="8" class="drop"/><rect x="300" width="85" height="72" rx="8" class="drop"/><rect x="400" width="85" height="72" rx="8" class="drop"/><rect x="500" width="85" height="72" rx="8" class="drop"/><rect x="600" width="85" height="72" rx="8" class="recent"/><rect x="700" width="85" height="72" rx="8" class="recent"/><rect x="800" width="85" height="72" rx="8" class="recent"/><rect x="900" width="85" height="72" rx="8" class="recent"/><text x="285" y="45" text-anchor="middle" class="note">较早历史已淘汰</text><text x="642" y="45" text-anchor="middle" class="label">7</text><text x="742" y="45" text-anchor="middle" class="label">8</text><text x="842" y="45" text-anchor="middle" class="label">9</text><text x="942" y="45" text-anchor="middle" class="label">10</text><line x1="995" y1="36" x2="1060" y2="36" class="arrow"/><circle cx="1100" cy="36" r="31" class="q"/><text x="1100" y="43" text-anchor="middle" fill="#fff" class="label">Q</text></g></g>
  <g transform="translate(55 550)"><rect width="1490" height="180" rx="14" class="panel"/><text x="35" y="52" class="head">StreamingLLM</text><text x="35" y="84" class="note">开头 sink + 最近窗口</text>
    <g transform="translate(355 52)"><rect x="0" width="85" height="72" rx="8" class="sink"/><rect x="100" width="85" height="72" rx="8" class="sink"/><rect x="200" width="85" height="72" rx="8" class="drop"/><rect x="300" width="85" height="72" rx="8" class="drop"/><rect x="400" width="85" height="72" rx="8" class="drop"/><rect x="500" width="85" height="72" rx="8" class="drop"/><rect x="600" width="85" height="72" rx="8" class="recent"/><rect x="700" width="85" height="72" rx="8" class="recent"/><rect x="800" width="85" height="72" rx="8" class="recent"/><rect x="900" width="85" height="72" rx="8" class="recent"/><text x="42" y="45" text-anchor="middle" class="label">sink</text><text x="142" y="45" text-anchor="middle" class="label">sink</text><text x="392" y="45" text-anchor="middle" class="note">中间淘汰</text><text x="642" y="45" text-anchor="middle" class="label">7</text><text x="742" y="45" text-anchor="middle" class="label">8</text><text x="842" y="45" text-anchor="middle" class="label">9</text><text x="942" y="45" text-anchor="middle" class="label">10</text><line x1="995" y1="36" x2="1060" y2="36" class="arrow"/><circle cx="1100" cy="36" r="31" class="q"/><text x="1100" y="43" text-anchor="middle" fill="#fff" class="label">Q</text></g></g>
  <g transform="translate(55 755)"><rect width="1490" height="180" rx="14" class="panel"/><text x="35" y="52" class="head">KV Pruning</text><text x="35" y="84" class="note">动态保留高分位置</text>
    <g transform="translate(355 52)"><rect x="0" width="85" height="72" rx="8" class="drop"/><rect x="100" width="85" height="72" rx="8" class="important"/><rect x="200" width="85" height="72" rx="8" class="drop"/><rect x="300" width="85" height="72" rx="8" class="drop"/><rect x="400" width="85" height="72" rx="8" class="important"/><rect x="500" width="85" height="72" rx="8" class="drop"/><rect x="600" width="85" height="72" rx="8" class="important"/><rect x="700" width="85" height="72" rx="8" class="drop"/><rect x="800" width="85" height="72" rx="8" class="drop"/><rect x="900" width="85" height="72" rx="8" class="recent"/><text x="42" y="45" text-anchor="middle" class="label">1</text><text x="142" y="45" text-anchor="middle" class="label">2</text><text x="242" y="45" text-anchor="middle" class="label">3</text><text x="342" y="45" text-anchor="middle" class="label">4</text><text x="442" y="45" text-anchor="middle" class="label">5</text><text x="542" y="45" text-anchor="middle" class="label">6</text><text x="642" y="45" text-anchor="middle" class="label">7</text><text x="742" y="45" text-anchor="middle" class="label">8</text><text x="842" y="45" text-anchor="middle" class="label">9</text><text x="942" y="45" text-anchor="middle" class="label">10</text><line x1="995" y1="36" x2="1060" y2="36" class="arrow"/><circle cx="1100" cy="36" r="31" class="q"/><text x="1100" y="43" text-anchor="middle" fill="#fff" class="label">Q</text></g></g>
  <text x="800" y="965" text-anchor="middle" class="sub">灰色表示不再保留；颜色同时编码保留原因，而不是 Attention 权重大小</text>
</svg>

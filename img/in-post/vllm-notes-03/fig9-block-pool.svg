<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="800" height="460" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">图 9　BlockPool：空闲队列 + 哈希表 + 引用计数</text>

  <!-- free queue -->
  <text x="20" y="68" font-size="13" font-weight="bold">空闲块队列 FreeKVCacheBlockQueue（双向链表）</text>
  <g font-size="12">
    <rect x="20" y="84" width="60" height="44" rx="6" fill="#eee" stroke="#999"/><text x="50" y="111" text-anchor="middle">头</text>
    <rect x="110" y="84" width="80" height="44" rx="6" fill="#fff" stroke="#555"/><text x="150" y="104" text-anchor="middle">块 9</text><text x="150" y="120" text-anchor="middle" font-size="10" fill="#777">无哈希</text>
    <rect x="220" y="84" width="80" height="44" rx="6" fill="#fff" stroke="#555"/><text x="260" y="104" text-anchor="middle">块 4</text><text x="260" y="120" text-anchor="middle" font-size="10" fill="#777">无哈希</text>
    <rect x="330" y="84" width="80" height="44" rx="6" fill="#dde8ff" stroke="#4a6fd1"/><text x="370" y="104" text-anchor="middle">块 7</text><text x="370" y="120" text-anchor="middle" font-size="10" fill="#4a6fd1">有哈希 h7</text>
    <rect x="440" y="84" width="80" height="44" rx="6" fill="#dde8ff" stroke="#4a6fd1"/><text x="480" y="104" text-anchor="middle">块 3</text><text x="480" y="120" text-anchor="middle" font-size="10" fill="#4a6fd1">有哈希 h3</text>
    <rect x="550" y="84" width="60" height="44" rx="6" fill="#eee" stroke="#999"/><text x="580" y="111" text-anchor="middle">尾</text>
    <line x1="80" y1="106" x2="108" y2="106" stroke="#555" marker-end="url(#a)"/><line x1="190" y1="106" x2="218" y2="106" stroke="#555" marker-end="url(#a)"/><line x1="300" y1="106" x2="328" y2="106" stroke="#555" marker-end="url(#a)"/><line x1="410" y1="106" x2="438" y2="106" stroke="#555" marker-end="url(#a)"/><line x1="520" y1="106" x2="548" y2="106" stroke="#555" marker-end="url(#a)"/>
    <text x="150" y="150" text-anchor="middle" fill="#c0392b">← 领新块从这里拿</text>
    <text x="480" y="150" text-anchor="middle" fill="#4a6fd1">越靠后越晚被复用 →</text>
  </g>
  <text x="630" y="96" font-size="11" fill="#555">假头假尾让"从中间</text>
  <text x="630" y="112" font-size="11" fill="#555">摘掉一个块"是 O(1)</text>

  <!-- hash table -->
  <rect x="20" y="170" width="300" height="110" rx="8" fill="#f7f0ff" stroke="#8a5cc7"/>
  <text x="170" y="194" text-anchor="middle" font-size="13" font-weight="bold">cached_block_hash_to_block</text>
  <text x="36" y="220" font-size="12">h7 → 块 7　　h3 → 块 3　　h1 → 块 1 …</text>
  <text x="36" y="246" font-size="11" fill="#555">块在空闲队列里也可以同时在这张表里：</text>
  <text x="36" y="266" font-size="11" fill="#555">内容还在，谁需要谁 touch 回来</text>

  <!-- operations -->
  <rect x="340" y="170" width="440" height="270" rx="8" fill="#fffbe6" stroke="#d4b106"/>
  <text x="356" y="194" font-size="13" font-weight="bold" fill="#8a6d00">四个动作</text>
  <g font-size="12" fill="#333">
    <text x="356" y="222" font-weight="bold">get_new_blocks(n)</text>
    <text x="370" y="240">从队头取 n 块；若块还带着旧哈希，先从哈希表删掉</text>
    <text x="370" y="256">（这就是"驱逐"），ref_cnt 从 0 变 1</text>
    <text x="356" y="284" font-weight="bold">touch(blocks)</text>
    <text x="370" y="302">前缀命中时用：ref_cnt 为 0 的先从队列摘出，然后 +1</text>
    <text x="356" y="330" font-weight="bold">free_blocks(blocks)</text>
    <text x="370" y="348">ref_cnt −1，降到 0 才回队列：没哈希的插到<tspan fill="#c0392b">队头</tspan>（先被复用），</text>
    <text x="370" y="364">有哈希的放到<tspan fill="#4a6fd1">队尾</tspan>（尽量留着等人命中，近似 LRU）</text>
    <text x="356" y="392" font-weight="bold">cache_full_blocks(…)</text>
    <text x="370" y="410">块填满后算好哈希，登记进哈希表</text>
    <text x="370" y="428" fill="#777" font-size="11">请求结束时按"倒序"释放，让链尾的块先被驱逐</text>
  </g>

  <rect x="20" y="296" width="300" height="144" rx="8" fill="#fff" stroke="#999"/>
  <text x="36" y="320" font-size="13" font-weight="bold">KVCacheBlock 本身</text>
  <g font-size="12" fill="#333">
    <text x="36" y="344">block_id　显存里第几块</text>
    <text x="36" y="366">ref_cnt　几个请求在用它</text>
    <text x="36" y="388">block_hash　满块才有</text>
    <text x="36" y="410">prev/next_free_block　链表指针</text>
    <text x="36" y="430" font-size="11" fill="#777">块 0 是 null_block，永远不分配</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="800" height="430" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">图 17　约束解码：语法掩码走过的路</text>

  <g font-size="12">
    <rect x="20" y="54" width="170" height="80" rx="8" fill="#dde8ff" stroke="#4a6fd1"/>
    <text x="105" y="76" text-anchor="middle" font-weight="bold">请求进来</text>
    <text x="105" y="96" text-anchor="middle" fill="#555">choice=["是","否"]</text>
    <text x="105" y="116" text-anchor="middle" fill="#555">grammar_init：线程池</text>
    <text x="105" y="130" text-anchor="middle" fill="#555">后台异步编译语法</text>
    <line x1="190" y1="94" x2="218" y2="94" stroke="#555" marker-end="url(#a)"/>

    <rect x="220" y="54" width="170" height="80" rx="8" fill="#f3f3f3" stroke="#999"/>
    <text x="305" y="76" text-anchor="middle" font-weight="bold">等编译</text>
    <text x="305" y="96" text-anchor="middle" fill="#555">WAITING_FOR_</text>
    <text x="305" y="112" text-anchor="middle" fill="#555">STRUCTURED_OUTPUT_GRAMMAR</text>
    <text x="305" y="128" text-anchor="middle" fill="#555">调度时先跳过它</text>
    <line x1="390" y1="94" x2="418" y2="94" stroke="#555" marker-end="url(#a)"/>

    <rect x="420" y="54" width="170" height="80" rx="8" fill="#d9f2df" stroke="#3a9a52"/>
    <text x="505" y="76" text-anchor="middle" font-weight="bold">编好了</text>
    <text x="505" y="96" text-anchor="middle" fill="#555">Future 完成 → WAITING</text>
    <text x="505" y="116" text-anchor="middle" fill="#555">正常参与调度</text>
    <line x1="590" y1="94" x2="618" y2="94" stroke="#555" marker-end="url(#a)"/>

    <rect x="620" y="54" width="160" height="80" rx="8" fill="#fff4e0" stroke="#e39b2d"/>
    <text x="700" y="76" text-anchor="middle" font-weight="bold">每一步</text>
    <text x="700" y="96" text-anchor="middle" fill="#555">CPU：get_grammar_bitmask</text>
    <text x="700" y="116" text-anchor="middle" fill="#555">GPU：同时在跑前向</text>
  </g>

  <!-- bitmask illustration -->
  <text x="20" y="172" font-size="13" font-weight="bold">掩码长什么样：每个 token 1 个比特，32 个 token 挤进一个 int32</text>
  <g font-size="11" text-anchor="middle">
    <text x="20" y="206" text-anchor="start">token</text>
    <g>
      <rect x="80" y="190" width="60" height="26" fill="#eee" stroke="#999"/><text x="110" y="208">"好"</text>
      <rect x="140" y="190" width="60" height="26" fill="#d9f2df" stroke="#3a9a52"/><text x="170" y="208">"是"</text>
      <rect x="200" y="190" width="60" height="26" fill="#eee" stroke="#999"/><text x="230" y="208">"的"</text>
      <rect x="260" y="190" width="60" height="26" fill="#d9f2df" stroke="#3a9a52"/><text x="290" y="208">"否"</text>
      <rect x="320" y="190" width="60" height="26" fill="#eee" stroke="#999"/><text x="350" y="208">"{"</text>
      <rect x="380" y="190" width="60" height="26" fill="#eee" stroke="#999"/><text x="410" y="208">…</text>
    </g>
    <text x="20" y="240" text-anchor="start">比特</text>
    <text x="110" y="240">0</text><text x="170" y="240" fill="#3a9a52" font-weight="bold">1</text><text x="230" y="240">0</text><text x="290" y="240" fill="#3a9a52" font-weight="bold">1</text><text x="350" y="240">0</text><text x="410" y="240">…</text>
    <text x="20" y="272" text-anchor="start">logits</text>
    <text x="110" y="272" fill="#c0392b">−∞</text><text x="170" y="272">2.1</text><text x="230" y="272" fill="#c0392b">−∞</text><text x="290" y="272">1.3</text><text x="350" y="272" fill="#c0392b">−∞</text><text x="410" y="272">…</text>
  </g>
  <text x="470" y="206" font-size="12" fill="#555">15 万词表 → 每个请求约 4700 个 int32</text>
  <text x="470" y="228" font-size="12" fill="#555">不受约束的请求整行填 −1（全是 1，全允许）</text>
  <text x="470" y="250" font-size="12" fill="#555">GPU 上 apply_token_bitmask_inplace：</text>
  <text x="470" y="270" font-size="12" fill="#555">比特为 0 的位置 logits 改成 −∞</text>

  <rect x="20" y="296" width="760" height="120" rx="8" fill="#fffbe6" stroke="#d4b106"/>
  <text x="36" y="320" font-size="13" font-weight="bold" fill="#8a6d00">一圈下来</text>
  <text x="36" y="344" font-size="12" fill="#555">1. 调度器问每个受约束请求的语法状态机"现在允许哪些 token"，填好掩码（CPU，和 GPU 前向并行）</text>
  <text x="36" y="366" font-size="12" fill="#555">2. sample_tokens 开头把掩码盖到 logits 上，再正常采样 → 只可能采到"是"或"否"</text>
  <text x="36" y="388" font-size="12" fill="#555">3. update_from_output 里 accept_tokens：把采到的 token 喂给状态机，状态机前进一步，下一步的掩码就变了</text>
  <text x="36" y="408" font-size="11" fill="#777">语法库可以是 xgrammar（默认）、guidance、outlines、lm-format-enforcer</text>
</svg>

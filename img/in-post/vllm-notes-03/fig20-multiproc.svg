<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="800" height="440" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">图 20　MultiprocExecutor：一份计划广播给 4 张卡（TP = 4）</text>

  <rect x="260" y="50" width="280" height="64" rx="8" fill="#fff4e0" stroke="#e39b2d" stroke-width="1.5"/>
  <text x="400" y="74" text-anchor="middle" font-weight="bold">EngineCore 进程</text>
  <text x="400" y="96" text-anchor="middle" font-size="12" fill="#555">collective_rpc("execute_model", 调度结果)</text>
  <line x1="400" y1="114" x2="400" y2="138" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="120" y="140" width="560" height="60" rx="8" fill="#fffbe6" stroke="#d4b106" stroke-width="1.5"/>
  <text x="400" y="164" text-anchor="middle" font-weight="bold">rpc_broadcast_mq（共享内存环形缓冲区）</text>
  <text x="400" y="186" text-anchor="middle" font-size="12" fill="#555">写一次，4 个进程都读同一份；超过 24 MiB 的大消息改走 ZMQ</text>

  <g font-size="12" text-anchor="middle">
    <rect x="30" y="240" width="170" height="80" rx="8" fill="#f7f0ff" stroke="#8a5cc7" stroke-width="2"/>
    <text x="115" y="264" font-weight="bold">Worker 0（GPU 0）</text><text x="115" y="284" fill="#555">worker_busy_loop</text><text x="115" y="302" fill="#c0392b">输出 rank：只有它回话</text>
    <rect x="220" y="240" width="170" height="80" rx="8" fill="#f7f0ff" stroke="#8a5cc7"/>
    <text x="305" y="264" font-weight="bold">Worker 1（GPU 1）</text><text x="305" y="284" fill="#555">worker_busy_loop</text>
    <rect x="410" y="240" width="170" height="80" rx="8" fill="#f7f0ff" stroke="#8a5cc7"/>
    <text x="495" y="264" font-weight="bold">Worker 2（GPU 2）</text><text x="495" y="284" fill="#555">worker_busy_loop</text>
    <rect x="600" y="240" width="170" height="80" rx="8" fill="#f7f0ff" stroke="#8a5cc7"/>
    <text x="685" y="264" font-weight="bold">Worker 3（GPU 3）</text><text x="685" y="284" fill="#555">worker_busy_loop</text>
  </g>
  <line x1="200" y1="200" x2="130" y2="238" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="330" y1="200" x2="305" y2="238" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="470" y1="200" x2="495" y2="238" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="600" y1="200" x2="675" y2="238" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="200" y1="280" x2="218" y2="280" stroke="#3a9a52" stroke-width="2"/><line x1="390" y1="280" x2="408" y2="280" stroke="#3a9a52" stroke-width="2"/><line x1="580" y1="280" x2="598" y2="280" stroke="#3a9a52" stroke-width="2"/>
  <text x="400" y="338" text-anchor="middle" font-size="11" fill="#3a9a52">卡之间每层 all-reduce（NCCL），把各自算的那一份拼成完整结果</text>

  <path d="M60,240 C40,160 120,110 256,90" fill="none" stroke="#c0392b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="46" y="140" font-size="11" fill="#c0392b">response_mq</text>
  <text x="46" y="156" font-size="11" fill="#c0392b">回 ModelRunnerOutput</text>

  <rect x="20" y="354" width="760" height="74" rx="8" fill="#f3f3f3" stroke="#999"/>
  <text x="36" y="376" font-size="12" fill="#333">启动握手：主进程先建广播队列 → 每张卡 fork 一个 WorkerProc（带 ready 管道和"死亡检测"管道）→ Worker 加载模型、</text>
  <text x="36" y="396" font-size="12" fill="#333">建好自己的应答队列后通过 ready 管道发 READY 和队列句柄 → 主进程连上所有应答队列 → Worker 进入死循环等任务。</text>
  <text x="36" y="416" font-size="11" fill="#777">输出 rank = 最后一个 PP 阶段的第一个 TP Worker；只有 TP 时就是 Worker 0。所有卡算出的采样结果都一样，只收一份就够了</text>
</svg>

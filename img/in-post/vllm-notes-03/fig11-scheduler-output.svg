<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="800" height="440" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">图 11　SchedulerOutput：新请求发全量，老请求只发变化</text>

  <rect x="20" y="50" width="400" height="330" rx="8" fill="#fff4e0" stroke="#e39b2d" stroke-width="1.5"/>
  <text x="220" y="74" text-anchor="middle" font-weight="bold">SchedulerOutput（调度器 → Worker）</text>

  <rect x="36" y="90" width="368" height="104" rx="6" fill="#dde8ff" stroke="#4a6fd1"/>
  <text x="50" y="112" font-size="13" font-weight="bold" fill="#223a80">scheduled_new_reqs：[NewRequestData, …]</text>
  <g font-size="12" fill="#333">
    <text x="50" y="134">第一次出现的请求，Worker 还不认识它，全都要给：</text>
    <text x="50" y="154">req_id、prompt_token_ids、sampling_params、</text>
    <text x="50" y="174">block_ids（整张块表）、num_computed_tokens …</text>
  </g>

  <rect x="36" y="204" width="368" height="104" rx="6" fill="#d9f2df" stroke="#3a9a52"/>
  <text x="50" y="226" font-size="13" font-weight="bold" fill="#1d5e2e">scheduled_cached_reqs：CachedRequestData</text>
  <g font-size="12" fill="#333">
    <text x="50" y="248">Worker 已经缓存过的请求，只发"差量"：</text>
    <text x="50" y="268">new_block_ids（这步新领的块）、num_computed_tokens、</text>
    <text x="50" y="288">resumed_req_ids（被抢占后回来的，块表要整张替换）</text>
  </g>

  <g font-size="12" fill="#333">
    <text x="36" y="330">num_scheduled_tokens：{req_id: 本步算几个}</text>
    <text x="36" y="350">scheduled_spec_decode_tokens：草稿 token</text>
    <text x="36" y="370">finished_req_ids：上一步结束的，Worker 可以删了</text>
  </g>

  <line x1="420" y1="215" x2="478" y2="215" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="480" y="50" width="300" height="330" rx="8" fill="#f7f0ff" stroke="#8a5cc7" stroke-width="1.5"/>
  <text x="630" y="74" text-anchor="middle" font-weight="bold" fill="#5a2f94">Worker 那边的"影子账本"</text>
  <g font-size="12" fill="#333">
    <text x="496" y="102" font-weight="bold">self.requests：{req_id: CachedRequestState}</text>
    <text x="508" y="122">每个请求的 token、块表、采样参数</text>
    <text x="496" y="152" font-weight="bold">self.input_batch：InputBatch</text>
    <text x="508" y="172">把上面的信息按"槽位"摊成大数组：</text>
    <text x="508" y="192">token_ids_cpu [最大请求数 × 最大长度]</text>
    <text x="508" y="212">num_computed_tokens_cpu、block_table</text>
    <text x="508" y="232">temperature / top_p / top_k 数组</text>
    <text x="496" y="262" font-weight="bold">_update_states() 每步开头：</text>
    <text x="508" y="282">1. 删掉 finished 的请求</text>
    <text x="508" y="302">2. 新请求：建 CachedRequestState，放进批</text>
    <text x="508" y="322">3. 老请求：追加 new_block_ids、更新 computed</text>
    <text x="508" y="342">4. condense：把后面的请求挪到空槽，</text>
    <text x="520" y="360">让数组前面是满的</text>
  </g>

  <rect x="20" y="394" width="760" height="36" rx="8" fill="#fffbe6" stroke="#d4b106"/>
  <text x="36" y="417" font-size="12" fill="#555">为什么分两种：一个请求可能活几百步，每步都发整份提示词太浪费；Worker 自己记着，调度器只告诉它"变了什么"。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Transformer 推理中的 Prefill、Decode 与 KV Cache</title>
  <desc id="desc">Prefill 一次处理全部 Prompt token 并建立 KV Cache；Decode 每次处理一个新 token，将新的 K 和 V 追加到缓存，再用当前 Q 查询完整缓存。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#315b8a"/>
    </marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#a74f4b"/>
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#4b8b61"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #17233a; }
      .subtitle { font-size: 20px; fill: #536176; }
      .head { font-size: 29px; font-weight: 750; fill: #17233a; }
      .label { font-size: 20px; font-weight: 700; fill: #17233a; }
      .small { font-size: 17px; fill: #536176; }
      .tiny { font-size: 15px; fill: #536176; }
      .panel { fill: #ffffff; stroke: #cfd7e3; stroke-width: 2; }
      .prompt { fill: #e8f4ea; stroke: #4b8b61; stroke-width: 2; }
      .matrix { fill: #e7f0fb; stroke: #4776a8; stroke-width: 2; }
      .score { fill: #eee8f7; stroke: #7657a8; stroke-width: 2; }
      .cache { fill: #fff1df; stroke: #b36b2c; stroke-width: 2; }
      .new { fill: #fbe9e7; stroke: #a74f4b; stroke-width: 2; }
      .arrow-blue { stroke: #315b8a; stroke-width: 2.6; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #a74f4b; stroke-width: 2.6; fill: none; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #4b8b61; stroke-width: 2.6; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#f7f8fa"/>
  <text x="800" y="62" text-anchor="middle" class="title">Transformer 推理：从 Prefill 到 Decode</text>
  <text x="800" y="100" text-anchor="middle" class="subtitle">KV Cache 把“重复处理历史”改成“只处理新增 token，再读取历史 K/V”</text>

  <rect x="55" y="145" width="1490" height="365" rx="18" class="panel"/>
  <text x="90" y="198" class="head">Prefill：一次处理整个 Prompt</text>
  <text x="90" y="232" class="small">Prompt 中的 token 都已知，适合把序列维度组织成大矩阵并行计算</text>

  <rect x="95" y="285" width="74" height="58" rx="9" class="prompt"/>
  <rect x="184" y="285" width="74" height="58" rx="9" class="prompt"/>
  <rect x="273" y="285" width="74" height="58" rx="9" class="prompt"/>
  <rect x="362" y="285" width="74" height="58" rx="9" class="prompt"/>
  <text x="132" y="321" text-anchor="middle" class="label">x₁</text>
  <text x="221" y="321" text-anchor="middle" class="label">x₂</text>
  <text x="310" y="321" text-anchor="middle" class="label">…</text>
  <text x="399" y="321" text-anchor="middle" class="label">xₜ</text>
  <text x="265" y="370" text-anchor="middle" class="tiny">Prompt token 序列</text>

  <path d="M455 314 H505" class="arrow-blue"/>
  <rect x="515" y="274" width="180" height="80" rx="12" class="matrix"/>
  <text x="605" y="307" text-anchor="middle" class="label">X [T, H]</text>
  <text x="605" y="334" text-anchor="middle" class="small">所有位置的 hidden</text>

  <path d="M710 314 H760" class="arrow-blue"/>
  <rect x="770" y="274" width="210" height="80" rx="12" class="matrix"/>
  <text x="875" y="307" text-anchor="middle" class="label">Q、K、V [T, Dₕ]</text>
  <text x="875" y="334" text-anchor="middle" class="small">一次性线性投影</text>

  <path d="M995 314 H1045" class="arrow-blue"/>
  <rect x="1055" y="274" width="190" height="80" rx="12" class="score"/>
  <text x="1150" y="307" text-anchor="middle" class="label">分数 [T, T]</text>
  <text x="1150" y="334" text-anchor="middle" class="small">加因果 Mask</text>

  <path d="M1260 314 H1305" class="arrow-green"/>
  <rect x="1315" y="255" width="190" height="118" rx="12" class="cache"/>
  <text x="1410" y="292" text-anchor="middle" class="label">每层 KV Cache</text>
  <text x="1410" y="323" text-anchor="middle" class="small">K₁:ₜ</text>
  <text x="1410" y="350" text-anchor="middle" class="small">V₁:ₜ</text>

  <rect x="515" y="405" width="730" height="54" rx="10" fill="#f1f5f9" stroke="#d6dee8"/>
  <text x="880" y="439" text-anchor="middle" class="small">Prefill 结束：通常只用最后一个位置的 logits 预测 xₜ₊₁，但每层的 K/V 都已建立</text>

  <rect x="55" y="550" width="1490" height="425" rx="18" class="panel"/>
  <text x="90" y="603" class="head">Decode：每次只处理一个新 token</text>
  <text x="90" y="637" class="small">历史 K/V 已经在缓存中；当前 token 产生新的 q、k、v，其中只有 k、v 会被留下</text>

  <rect x="95" y="700" width="130" height="70" rx="12" class="new"/>
  <text x="160" y="730" text-anchor="middle" class="label">xₜ₊₁</text>
  <text x="160" y="754" text-anchor="middle" class="small">新 token</text>
  <path d="M245 735 H295" class="arrow-red"/>

  <rect x="305" y="690" width="175" height="90" rx="12" class="matrix"/>
  <text x="392" y="726" text-anchor="middle" class="label">hₜ₊₁ [1, H]</text>
  <text x="392" y="754" text-anchor="middle" class="small">当前 hidden</text>
  <path d="M500 735 H550" class="arrow-red"/>

  <rect x="560" y="680" width="205" height="110" rx="12" class="new"/>
  <text x="662" y="718" text-anchor="middle" class="label">qₜ₊₁、kₜ₊₁、vₜ₊₁</text>
  <text x="662" y="748" text-anchor="middle" class="small">每个都是 [1, Dₕ]</text>
  <text x="662" y="774" text-anchor="middle" class="tiny">单 token 投影</text>

  <path d="M785 710 H845" class="arrow-red"/>
  <rect x="855" y="660" width="235" height="100" rx="12" class="score"/>
  <text x="972" y="698" text-anchor="middle" class="label">qₜ₊₁ 查询缓存</text>
  <text x="972" y="728" text-anchor="middle" class="small">[1,Dₕ] @ [T+1,Dₕ]ᵀ</text>
  <text x="972" y="750" text-anchor="middle" class="small">得到 [1,T+1] 分数</text>

  <path d="M785 765 C800 820 825 835 855 835" class="arrow-green"/>
  <rect x="855" y="790" width="235" height="100" rx="12" class="cache"/>
  <text x="972" y="827" text-anchor="middle" class="label">追加 kₜ₊₁、vₜ₊₁</text>
  <text x="972" y="857" text-anchor="middle" class="small">K₁:ₜ → K₁:ₜ₊₁</text>
  <text x="972" y="879" text-anchor="middle" class="small">V₁:ₜ → V₁:ₜ₊₁</text>

  <path d="M1100 710 H1160" class="arrow-blue"/>
  <path d="M1100 840 C1130 840 1130 735 1160 735" class="arrow-green"/>
  <rect x="1170" y="670" width="205" height="120" rx="12" class="matrix"/>
  <text x="1272" y="708" text-anchor="middle" class="label">Attention 输出</text>
  <text x="1272" y="740" text-anchor="middle" class="small">oₜ₊₁ [1,Dₕ]</text>
  <text x="1272" y="767" text-anchor="middle" class="small">→ 预测 xₜ₊₂</text>

  <rect x="1165" y="835" width="340" height="62" rx="10" fill="#f8f1e8" stroke="#e0c5a4"/>
  <text x="1335" y="862" text-anchor="middle" class="small">q：用完即释放</text>
  <text x="1335" y="884" text-anchor="middle" class="small">k/v：追加并保留</text>

  <text x="800" y="1020" text-anchor="middle" class="subtitle">核心变化：序列维度从“整段 T”变成“当前 1”，历史信息由 KV Cache 提供</text>
</svg>

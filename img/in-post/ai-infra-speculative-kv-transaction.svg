<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">投机解码中的 KV Cache 事务</title><desc id="desc">正式上下文后临时写入四个候选的 KV，只提交接受的三个并回滚拒绝部分。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536d8b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:42px;font-weight:800;fill:#17233a}.sub{font-size:20px;fill:#56647a}.head{font-size:27px;font-weight:750;fill:#17233a}.label{font-size:19px;font-weight:700;fill:#263750}.small{font-size:17px;fill:#56647a}.panel{fill:#fff;stroke:#d2d9e3;stroke-width:2}.old{fill:#e8f1fb;stroke:#4b78a8;stroke-width:2}.temp{fill:#fff0df;stroke:#b86e30;stroke-width:2}.commit{fill:#e8f4ea;stroke:#4d8a61;stroke-width:2}.rollback{fill:#f8e6e6;stroke:#a95858;stroke-width:2}.line{stroke:#536d8b;stroke-width:3;fill:none;marker-end:url(#a)}.cut{stroke:#a95858;stroke-width:4;stroke-dasharray:9 7}</style></defs>
  <rect width="1600" height="820" fill="#f7f8fa"/><text x="800" y="60" text-anchor="middle" class="title">KV Cache 像一次事务：先临时写，再提交或回滚</text><text x="800" y="98" text-anchor="middle" class="sub">每一层使用相同的有效长度边界</text>
  <rect x="60" y="145" width="1480" height="170" rx="14" class="panel"/><text x="95" y="195" class="head">验证前：正式缓存</text><g transform="translate(470 205)"><rect x="0" width="140" height="70" rx="8" class="old"/><rect x="155" width="140" height="70" rx="8" class="old"/><rect x="310" width="140" height="70" rx="8" class="old"/><rect x="465" width="140" height="70" rx="8" class="old"/><text x="70" y="43" text-anchor="middle" class="label">历史 1</text><text x="225" y="43" text-anchor="middle" class="label">历史 2</text><text x="380" y="43" text-anchor="middle" class="label">...</text><text x="535" y="43" text-anchor="middle" class="label">上下文 t</text></g>
  <path d="M800 325V370" class="line"/>
  <rect x="60" y="385" width="1480" height="180" rx="14" class="panel"/><text x="95" y="435" class="head">验证中：预留槽位临时写入</text><g transform="translate(280 455)"><rect x="0" width="140" height="70" rx="8" class="old"/><rect x="155" width="140" height="70" rx="8" class="old"/><rect x="310" width="140" height="70" rx="8" class="temp"/><rect x="465" width="140" height="70" rx="8" class="temp"/><rect x="620" width="140" height="70" rx="8" class="temp"/><rect x="775" width="140" height="70" rx="8" class="temp"/><text x="70" y="43" text-anchor="middle" class="label">历史...</text><text x="225" y="43" text-anchor="middle" class="label">上下文 t</text><text x="380" y="43" text-anchor="middle" class="label">很</text><text x="535" y="43" text-anchor="middle" class="label">适</text><text x="690" y="43" text-anchor="middle" class="label">合</text><text x="845" y="43" text-anchor="middle" class="label">散步</text><line x1="767" y1="-10" x2="767" y2="85" class="cut"/><text x="790" y="-18" class="small">拒绝边界</text></g>
  <path d="M800 575V620" class="line"/>
  <rect x="60" y="635" width="1480" height="135" rx="14" class="panel"/><text x="95" y="685" class="head">验证后</text><g transform="translate(380 670)"><rect x="0" width="140" height="70" rx="8" class="old"/><rect x="155" width="140" height="70" rx="8" class="old"/><rect x="310" width="140" height="70" rx="8" class="commit"/><rect x="465" width="140" height="70" rx="8" class="commit"/><rect x="620" width="140" height="70" rx="8" class="commit"/><text x="70" y="43" text-anchor="middle" class="label">历史...</text><text x="225" y="43" text-anchor="middle" class="label">上下文 t</text><text x="380" y="43" text-anchor="middle" class="label">很 ✓</text><text x="535" y="43" text-anchor="middle" class="label">适 ✓</text><text x="690" y="43" text-anchor="middle" class="label">合 ✓</text></g><rect x="1200" y="670" width="235" height="70" rx="8" class="rollback"/><text x="1317" y="700" text-anchor="middle" class="label">“散步”回滚</text><text x="1317" y="728" text-anchor="middle" class="small">不进入正式历史</text>
</svg>

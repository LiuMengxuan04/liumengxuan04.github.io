<text x="225" y="179" text-anchor="end" font-size="20">峰值算术时间</text>
<rect x="255" y="151" width="3.8699999999999997" height="40" rx="4" fill="#377ac0"/>
<text x="270" y="179" text-anchor="start" font-size="20">0.043 ms</text>
<text x="225" y="270" text-anchor="end" font-size="20">权重搬运时间</text>
<rect x="255" y="242" width="603.0" height="40" rx="4" fill="#d37a32"/>
<text x="870" y="270" text-anchor="start" font-size="20">6.7 ms</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">单 token Decode：算得少，也可能搬得久</title><desc id="desc">相同零到七毫秒轴比较峰值算术时间零点零四三毫秒与权重搬运时间六点七毫秒，使用理想算力带宽估算并非实测。</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK JP","Microsoft YaHei",sans-serif;fill:#24354a}</style><rect width="1000" height="430" fill="#f7f9fc"/>
<text x="500" y="48" text-anchor="middle" font-size="28" font-weight="bold">单 token Decode：算得少，也可能搬得久</text>
<text x="500" y="90" text-anchor="middle" font-size="18">粗略假设：13.4 GFLOPs，13.4 GB 权重，312 TFLOP/s，2 TB/s</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc"><title id="title">一行特征，分给四个线程处理</title><desc id="desc">十六个特征值等于一到十六；线程按下标模四分工，局部平方和为276 336 404 480，合并为1496。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK JP","Microsoft YaHei",sans-serif;fill:#24354a} text.small{font-size:17px}</style><rect width="1000" height="730" fill="#f7f9fc"/>
<text x="500" y="48" text-anchor="middle" font-size="28" font-weight="bold">一行特征，分给四个线程处理</text>
<text x="500" y="88" text-anchor="middle" font-size="17">缩小示例：D = 16，4 个线程；实际可用 256 个线程处理 D = 4096</text>
<text x="65" y="142" text-anchor="middle" font-size="23">HBM</text>
<rect x="65" y="164" width="51" height="49" rx="6" fill="#377ac0" stroke="none"/>
<text x="90" y="196" text-anchor="middle" font-size="20" style="fill:white">1</text>
<text x="90" y="238" text-anchor="middle" font-size="15">0</text>
<rect x="120" y="164" width="51" height="49" rx="6" fill="#d37a32" stroke="none"/>
<text x="145" y="196" text-anchor="middle" font-size="20" style="fill:white">2</text>
<text x="145" y="238" text-anchor="middle" font-size="15">1</text>
<rect x="175" y="164" width="51" height="49" rx="6" fill="#218578" stroke="none"/>
<text x="200" y="196" text-anchor="middle" font-size="20" style="fill:white">3</text>
<text x="200" y="238" text-anchor="middle" font-size="15">2</text>
<rect x="230" y="164" width="51" height="49" rx="6" fill="#8860ae" stroke="none"/>
<text x="255" y="196" text-anchor="middle" font-size="20" style="fill:white">4</text>
<text x="255" y="238" text-anchor="middle" font-size="15">3</text>
<rect x="285" y="164" width="51" height="49" rx="6" fill="#377ac0" stroke="none"/>
<text x="310" y="196" text-anchor="middle" font-size="20" style="fill:white">5</text>
<text x="310" y="238" text-anchor="middle" font-size="15">4</text>
<rect x="340" y="164" width="51" height="49" rx="6" fill="#d37a32" stroke="none"/>
<text x="365" y="196" text-anchor="middle" font-size="20" style="fill:white">6</text>
<text x="365" y="238" text-anchor="middle" font-size="15">5</text>
<rect x="395" y="164" width="51" height="49" rx="6" fill="#218578" stroke="none"/>
<text x="420" y="196" text-anchor="middle" font-size="20" style="fill:white">7</text>
<text x="420" y="238" text-anchor="middle" font-size="15">6</text>
<rect x="450" y="164" width="51" height="49" rx="6" fill="#8860ae" stroke="none"/>
<text x="475" y="196" text-anchor="middle" font-size="20" style="fill:white">8</text>
<text x="475" y="238" text-anchor="middle" font-size="15">7</text>
<rect x="505" y="164" width="51" height="49" rx="6" fill="#377ac0" stroke="none"/>
<text x="530" y="196" text-anchor="middle" font-size="20" style="fill:white">9</text>
<text x="530" y="238" text-anchor="middle" font-size="15">8</text>
<rect x="560" y="164" width="51" height="49" rx="6" fill="#d37a32" stroke="none"/>
<text x="585" y="196" text-anchor="middle" font-size="20" style="fill:white">10</text>
<text x="585" y="238" text-anchor="middle" font-size="15">9</text>
<rect x="615" y="164" width="51" height="49" rx="6" fill="#218578" stroke="none"/>
<text x="640" y="196" text-anchor="middle" font-size="20" style="fill:white">11</text>
<text x="640" y="238" text-anchor="middle" font-size="15">10</text>
<rect x="670" y="164" width="51" height="49" rx="6" fill="#8860ae" stroke="none"/>
<text x="695" y="196" text-anchor="middle" font-size="20" style="fill:white">12</text>
<text x="695" y="238" text-anchor="middle" font-size="15">11</text>
<rect x="725" y="164" width="51" height="49" rx="6" fill="#377ac0" stroke="none"/>
<text x="750" y="196" text-anchor="middle" font-size="20" style="fill:white">13</text>
<text x="750" y="238" text-anchor="middle" font-size="15">12</text>
<rect x="780" y="164" width="51" height="49" rx="6" fill="#d37a32" stroke="none"/>
<text x="805" y="196" text-anchor="middle" font-size="20" style="fill:white">14</text>
<text x="805" y="238" text-anchor="middle" font-size="15">13</text>
<rect x="835" y="164" width="51" height="49" rx="6" fill="#218578" stroke="none"/>
<text x="860" y="196" text-anchor="middle" font-size="20" style="fill:white">15</text>
<text x="860" y="238" text-anchor="middle" font-size="15">14</text>
<rect x="890" y="164" width="51" height="49" rx="6" fill="#8860ae" stroke="none"/>
<text x="915" y="196" text-anchor="middle" font-size="20" style="fill:white">16</text>
<text x="915" y="238" text-anchor="middle" font-size="15">15</text>
<text x="500" y="266" text-anchor="middle" font-size="17">上排是特征值；下排是下标。颜色表示负责该元素的线程。</text>
<rect x="40" y="300" width="920" height="355" rx="16" fill="#e9eef5" stroke="#c5d1df"/>
<text x="500" y="334" text-anchor="middle" font-size="22">GPU 线程块：读取后尽量保存在寄存器中</text>
<rect x="65" y="365" width="195" height="185" rx="10" fill="#fff" stroke="#377ac0"/>
<text x="162" y="398" text-anchor="middle" font-size="22">线程 0</text>
<text x="162" y="442" text-anchor="middle" font-size="22">1  5  9  13</text>
<text x="162" y="482" text-anchor="middle" font-size="18">局部平方和</text>
<text x="162" y="522" text-anchor="middle" font-size="25">276</text>
<rect x="290" y="365" width="195" height="185" rx="10" fill="#fff" stroke="#d37a32"/>
<text x="387" y="398" text-anchor="middle" font-size="22">线程 1</text>
<text x="387" y="442" text-anchor="middle" font-size="22">2  6  10  14</text>
<text x="387" y="482" text-anchor="middle" font-size="18">局部平方和</text>
<text x="387" y="522" text-anchor="middle" font-size="25">336</text>
<rect x="515" y="365" width="195" height="185" rx="10" fill="#fff" stroke="#218578"/>
<text x="612" y="398" text-anchor="middle" font-size="22">线程 2</text>
<text x="612" y="442" text-anchor="middle" font-size="22">3  7  11  15</text>
<text x="612" y="482" text-anchor="middle" font-size="18">局部平方和</text>
<text x="612" y="522" text-anchor="middle" font-size="25">404</text>
<rect x="740" y="365" width="195" height="185" rx="10" fill="#fff" stroke="#8860ae"/>
<text x="837" y="398" text-anchor="middle" font-size="22">线程 3</text>
<text x="837" y="442" text-anchor="middle" font-size="22">4  8  12  16</text>
<text x="837" y="482" text-anchor="middle" font-size="18">局部平方和</text>
<text x="837" y="522" text-anchor="middle" font-size="25">480</text>
<text x="500" y="602" text-anchor="middle" font-size="24">归约：276 + 336 + 404 + 480 = 1496</text>
<text x="500" y="635" text-anchor="middle" font-size="21">共享 inv_rms = 1 / √(1496 / 16 + ε)</text>
<text x="500" y="695" text-anchor="middle" font-size="19">各线程复用自己的 x，计算 y = γ × x × inv_rms，再写回显存</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">滑动窗口通过网络深度扩大感受野</title><desc id="desc">位置八在第一层直接读取六到八，在第二层通过位置六间接获得位置四的信息。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55708f"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:42px;font-weight:800;fill:#17233a}.sub{font-size:20px;fill:#56647a}.layer{font-size:25px;font-weight:750;fill:#17233a}.token{font-size:18px;font-weight:700;fill:#263750}.box{fill:#fff;stroke:#cfd7e2;stroke-width:2}.active{fill:#e8f1fb;stroke:#4b78a8;stroke-width:2}.target{fill:#f8e7e5;stroke:#a95858;stroke-width:2}.path{stroke:#55708f;stroke-width:3;fill:none;marker-end:url(#a)}.faint{stroke:#9caabc;stroke-width:2;fill:none;marker-end:url(#a);opacity:.55}</style></defs>
  <rect width="1600" height="900" fill="#f7f8fa"/><text x="800" y="58" text-anchor="middle" class="title">每层只看局部，多层可以接力传递</text><text x="800" y="96" text-anchor="middle" class="sub">窗口：当前位置 + 前面两个位置；箭头从被读取位置指向新隐藏状态</text>
  <text x="70" y="215" class="layer">输入 h⁽⁰⁾</text><text x="70" y="450" class="layer">第 1 层 h⁽¹⁾</text><text x="70" y="685" class="layer">第 2 层 h⁽²⁾</text>
  <g transform="translate(300 165)"><rect x="0" width="100" height="78" rx="8" class="box"/><rect x="140" width="100" height="78" rx="8" class="box"/><rect x="280" width="100" height="78" rx="8" class="box"/><rect x="420" width="100" height="78" rx="8" class="active"/><rect x="560" width="100" height="78" rx="8" class="active"/><rect x="700" width="100" height="78" rx="8" class="active"/><rect x="840" width="100" height="78" rx="8" class="active"/><rect x="980" width="100" height="78" rx="8" class="target"/><text x="50" y="48" text-anchor="middle" class="token">位置 1</text><text x="190" y="48" text-anchor="middle" class="token">位置 2</text><text x="330" y="48" text-anchor="middle" class="token">位置 3</text><text x="470" y="48" text-anchor="middle" class="token">位置 4</text><text x="610" y="48" text-anchor="middle" class="token">位置 5</text><text x="750" y="48" text-anchor="middle" class="token">位置 6</text><text x="890" y="48" text-anchor="middle" class="token">位置 7</text><text x="1030" y="48" text-anchor="middle" class="token">位置 8</text></g>
  <g transform="translate(300 400)"><rect x="420" width="100" height="78" rx="8" class="active"/><rect x="560" width="100" height="78" rx="8" class="active"/><rect x="700" width="100" height="78" rx="8" class="active"/><rect x="840" width="100" height="78" rx="8" class="active"/><rect x="980" width="100" height="78" rx="8" class="target"/><text x="470" y="48" text-anchor="middle" class="token">h₄⁽¹⁾</text><text x="610" y="48" text-anchor="middle" class="token">h₅⁽¹⁾</text><text x="750" y="48" text-anchor="middle" class="token">h₆⁽¹⁾</text><text x="890" y="48" text-anchor="middle" class="token">h₇⁽¹⁾</text><text x="1030" y="48" text-anchor="middle" class="token">h₈⁽¹⁾</text></g>
  <path d="M1050 243L1295 392M1190 243L1320 392M1330 243L1345 392" class="faint"/>
  <text x="315" y="340" class="sub">第一层：位置 8 直接读取位置 6、7、8</text>
  <g transform="translate(300 635)"><rect x="700" width="100" height="78" rx="8" class="active"/><rect x="840" width="100" height="78" rx="8" class="active"/><rect x="980" width="100" height="78" rx="8" class="target"/><text x="750" y="48" text-anchor="middle" class="token">h₆⁽²⁾</text><text x="890" y="48" text-anchor="middle" class="token">h₇⁽²⁾</text><text x="1030" y="48" text-anchor="middle" class="token">h₈⁽²⁾</text></g>
  <path d="M1050 478L1295 627M1190 478L1320 627M1330 478L1345 627" class="faint"/><path d="M770 243L1050 392L1330 627" class="path"/>
  <text x="300" y="790" class="sub">信息路径：位置 4 → 第一层位置 6 → 第二层位置 8</text><text x="300" y="830" class="sub">层与层之间传递完整 Block 输出 h：Attention 收集信息，FFN 独立加工每个位置</text>
</svg>

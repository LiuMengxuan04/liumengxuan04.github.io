<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="800" height="420" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">图 5　slot_mapping：每个新 token 的 KV 写到哪个格子</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#555">继续用请求 C：块表 [6, 7, 9]，已缓存 512 个，本步要算第 512–619 号 token</text>

  <!-- logical -->
  <text x="30" y="92" font-weight="bold" fill="#333">逻辑位置</text>
  <g text-anchor="middle" font-size="12">
    <rect x="130" y="75" width="200" height="30" fill="#d9f2df" stroke="#3a9a52"/><text x="230" y="95">0–255（逻辑块 0）</text>
    <rect x="330" y="75" width="200" height="30" fill="#d9f2df" stroke="#3a9a52"/><text x="430" y="95">256–511（逻辑块 1）</text>
    <rect x="530" y="75" width="85" height="30" fill="#fff4e0" stroke="#e39b2d"/><text x="572" y="95">512–619</text>
    <rect x="615" y="75" width="115" height="30" fill="#fafafa" stroke="#ccc"/><text x="672" y="95" fill="#999">还空着</text>
  </g>
  <text x="230" y="122" text-anchor="middle" font-size="11" fill="#1d5e2e">命中缓存，不再计算</text>
  <text x="430" y="122" text-anchor="middle" font-size="11" fill="#1d5e2e">命中缓存，不再计算</text>
  <text x="620" y="122" text-anchor="middle" font-size="11" fill="#8a5a10">本步新算的 108 个</text>

  <!-- physical -->
  <text x="30" y="192" font-weight="bold" fill="#333">物理块</text>
  <g text-anchor="middle" font-size="12">
    <rect x="130" y="172" width="150" height="30" fill="#eef3ff" stroke="#4a6fd1"/><text x="205" y="192">块 6：格子 1536–1791</text>
    <rect x="290" y="172" width="150" height="30" fill="#eef3ff" stroke="#4a6fd1"/><text x="365" y="192">块 7：格子 1792–2047</text>
    <rect x="470" y="172" width="260" height="30" fill="#eef3ff" stroke="#4a6fd1"/><text x="600" y="192">块 9：格子 2304–2559</text>
  </g>
  <line x1="572" y1="106" x2="540" y2="169" stroke="#e39b2d" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="30" y="225" width="740" height="180" rx="8" fill="#f7f7f7" stroke="#ccc"/>
  <text x="50" y="250" font-weight="bold" fill="#333">prepare_prefill 里的计算</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#333">
    <text x="50" y="275">start = 512, end = 620</text>
    <text x="50" y="297">start_block = 512 // 256 = 2,  end_block = (620 + 255) // 256 = 3  → 只循环 i = 2</text>
    <text x="50" y="319">slot_start = block_table[2] * 256 + 512 % 256 = 9 * 256 + 0 = 2304</text>
    <text x="50" y="341">slot_end   = 9 * 256 + (620 − 2 * 256)        = 2412        （i 是最后一块）</text>
    <text x="50" y="363">slot_mapping = [2304, 2305, …, 2411]  共 108 个</text>
    <text x="50" y="385">cu_seqlens_q = [0, 108]   cu_seqlens_k = [0, 620]   → k 比 q 长，要传 block_tables</text>
  </g>
</svg>

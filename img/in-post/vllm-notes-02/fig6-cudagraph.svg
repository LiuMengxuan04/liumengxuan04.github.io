<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="800" height="400" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">图 6　CUDA Graph：先录好几种批大小，运行时挑一个装得下的</text>

  <text x="30" y="70" font-weight="bold" fill="#333">启动时录制（从大到小，共用一个显存池）</text>
  <g text-anchor="middle" font-size="12">
    <rect x="30" y="82" width="46" height="30" rx="4" fill="#f7f0ff" stroke="#8a5cc7"/><text x="53" y="102">1</text>
    <rect x="82" y="82" width="46" height="30" rx="4" fill="#f7f0ff" stroke="#8a5cc7"/><text x="105" y="102">2</text>
    <rect x="134" y="82" width="46" height="30" rx="4" fill="#f7f0ff" stroke="#8a5cc7"/><text x="157" y="102">4</text>
    <rect x="186" y="82" width="46" height="30" rx="4" fill="#f7f0ff" stroke="#8a5cc7"/><text x="209" y="102">8</text>
    <rect x="238" y="82" width="46" height="30" rx="4" fill="#e9dcff" stroke="#8a5cc7" stroke-width="2"/><text x="261" y="102" font-weight="bold">16</text>
    <rect x="290" y="82" width="46" height="30" rx="4" fill="#f7f0ff" stroke="#8a5cc7"/><text x="313" y="102">32</text>
    <rect x="342" y="82" width="46" height="30" rx="4" fill="#f7f0ff" stroke="#8a5cc7"/><text x="365" y="102">48</text>
    <text x="420" y="102" fill="#555">…</text>
    <rect x="450" y="82" width="56" height="30" rx="4" fill="#f7f0ff" stroke="#8a5cc7"/><text x="478" y="102">512</text>
  </g>
  <text x="530" y="102" font-size="12" fill="#555">1、2、4、8，之后每 16 一档，共 36 张图</text>

  <text x="30" y="160" font-weight="bold" fill="#333">运行时：这一步解码有 13 个请求</text>
  <g font-size="12" text-anchor="middle">
    <text x="30" y="196" text-anchor="start" fill="#555">input_ids</text>
    <g fill="#dde8ff" stroke="#4a6fd1">
      <rect x="120" y="180" width="30" height="26"/><rect x="150" y="180" width="30" height="26"/><rect x="180" y="180" width="30" height="26"/><rect x="210" y="180" width="30" height="26"/><rect x="240" y="180" width="30" height="26"/><rect x="270" y="180" width="30" height="26"/><rect x="300" y="180" width="30" height="26"/><rect x="330" y="180" width="30" height="26"/><rect x="360" y="180" width="30" height="26"/><rect x="390" y="180" width="30" height="26"/><rect x="420" y="180" width="30" height="26"/><rect x="450" y="180" width="30" height="26"/><rect x="480" y="180" width="30" height="26"/>
    </g>
    <g fill="#f3f3f3" stroke="#bbb"><rect x="510" y="180" width="30" height="26"/><rect x="540" y="180" width="30" height="26"/><rect x="570" y="180" width="30" height="26"/></g>
    <text x="315" y="226" fill="#223a80">[:13] 写入真实数据</text>
    <text x="555" y="226" fill="#777">剩下 3 行是上次的旧值</text>

    <text x="30" y="266" text-anchor="start" fill="#555">slot_mapping</text>
    <rect x="120" y="250" width="390" height="26" fill="#dde8ff" stroke="#4a6fd1"/><text x="315" y="268">13 个真实格子号</text>
    <rect x="510" y="250" width="90" height="26" fill="#fff0f0" stroke="#c0392b"/><text x="555" y="268" fill="#8b1a1a">-1</text>
    <text x="30" y="306" text-anchor="start" fill="#555">context_lens</text>
    <rect x="120" y="290" width="390" height="26" fill="#dde8ff" stroke="#4a6fd1"/><text x="315" y="308">13 个真实长度</text>
    <rect x="510" y="290" width="90" height="26" fill="#fff0f0" stroke="#c0392b"/><text x="555" y="308" fill="#8b1a1a">0</text>
  </g>
  <line x1="610" y1="265" x2="650" y2="265" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="655" y="260" font-size="12" fill="#333">-1：KV 写入核直接跳过</text>
  <text x="655" y="278" font-size="12" fill="#333">0：注意力不读任何历史</text>
  <line x1="615" y1="195" x2="650" y2="195" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="655" y="190" font-size="12" fill="#333">用 bs=16 的图回放</text>
  <text x="655" y="208" font-size="12" fill="#333">只取 outputs[:13]</text>

  <rect x="30" y="340" width="740" height="44" rx="6" fill="#fffbe6" stroke="#d4b106"/>
  <text x="400" y="360" text-anchor="middle" fill="#7a6400">CUDA Graph 回放时只认录制那一刻的显存地址，所以输入必须写进同一组固定张量（graph_vars），不能换新张量</text>
  <text x="400" y="377" text-anchor="middle" font-size="11" fill="#7a6400">预填充长度千变万化，不走图；解码批超过 512 也不走图</text>
</svg>

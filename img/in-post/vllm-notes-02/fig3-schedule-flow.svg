<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="800" height="520" fill="#fff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">图 3　Scheduler.schedule() 的决策流程</text>

  <!-- left: prefill -->
  <rect x="20" y="50" width="370" height="455" rx="10" fill="#f6f9ff" stroke="#4a6fd1" stroke-dasharray="6 4"/>
  <text x="205" y="72" text-anchor="middle" font-weight="bold" fill="#223a80">第一阶段：预填充（优先）</text>

  <g text-anchor="middle">
    <rect x="60" y="88" width="290" height="36" rx="6" fill="#fff" stroke="#4a6fd1"/><text x="205" y="111">看等待队列队首 seq = waiting[0]</text>
    <rect x="60" y="140" width="290" height="36" rx="6" fill="#fff" stroke="#4a6fd1"/><text x="205" y="163">token 预算用完 / 已满 max_num_seqs？</text>
    <rect x="60" y="192" width="290" height="50" rx="6" fill="#fff" stroke="#4a6fd1"/><text x="205" y="212">还没分块：can_allocate 查前缀命中</text><text x="205" y="231" font-size="11" fill="#555">空闲块不够 → 停；已分块（续块）→ 直接算剩余</text>
    <rect x="60" y="258" width="290" height="50" rx="6" fill="#fff" stroke="#4a6fd1"/><text x="205" y="278">剩余预算 &lt; 需要的 token 数？</text><text x="205" y="297" font-size="11" fill="#555">只有本批第一个 seq 允许被切块，否则停</text>
    <rect x="60" y="324" width="290" height="50" rx="6" fill="#fff" stroke="#4a6fd1"/><text x="205" y="344">allocate 块；sched = min(需要, 剩余)</text><text x="205" y="363" font-size="11" fill="#555">预算 -= sched</text>
    <rect x="60" y="390" width="290" height="50" rx="6" fill="#fff" stroke="#4a6fd1"/><text x="205" y="410">这一块算完就追上了？</text><text x="205" y="429" font-size="11" fill="#555">是 → 移进运行队列；否 → 继续留在 waiting 队首</text>
    <rect x="60" y="456" width="290" height="36" rx="6" fill="#e4ecff" stroke="#4a6fd1"/><text x="205" y="479" font-weight="bold" fill="#223a80">选中了任何 seq → 返回 (seqs, True)</text>
  </g>
  <g stroke="#555" stroke-width="1.3">
    <line x1="205" y1="124" x2="205" y2="137" marker-end="url(#a)"/>
    <line x1="205" y1="176" x2="205" y2="189" marker-end="url(#a)"/>
    <line x1="205" y1="242" x2="205" y2="255" marker-end="url(#a)"/>
    <line x1="205" y1="308" x2="205" y2="321" marker-end="url(#a)"/>
    <line x1="205" y1="374" x2="205" y2="387" marker-end="url(#a)"/>
    <line x1="205" y1="440" x2="205" y2="453" marker-end="url(#a)"/>
  </g>
  <path d="M60,415 H40 V106 H57" fill="none" stroke="#3a9a52" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="34" y="260" font-size="11" fill="#1d5e2e" transform="rotate(-90 34 260)" text-anchor="middle">下一个 seq</text>

  <!-- right: decode -->
  <rect x="410" y="50" width="370" height="455" rx="10" fill="#f6fcf7" stroke="#3a9a52" stroke-dasharray="6 4"/>
  <text x="595" y="72" text-anchor="middle" font-weight="bold" fill="#1d5e2e">第二阶段：解码（预填充一个都没选时）</text>
  <g text-anchor="middle">
    <rect x="450" y="88" width="290" height="36" rx="6" fill="#fff" stroke="#3a9a52"/><text x="595" y="111">seq = running.popleft()</text>
    <rect x="450" y="140" width="290" height="50" rx="6" fill="#fff" stroke="#3a9a52"/><text x="595" y="160">can_append：这个 token 需要新块吗？</text><text x="595" y="179" font-size="11" fill="#555">len % 块大小 == 1 时才需要 1 个空闲块</text>
    <rect x="450" y="206" width="290" height="64" rx="6" fill="#fff0f0" stroke="#c0392b"/><text x="595" y="226" fill="#8b1a1a">块不够 → 抢占</text><text x="595" y="245" font-size="11" fill="#555">运行队列还有别人：踢走队尾那个，再试</text><text x="595" y="262" font-size="11" fill="#555">没有别人了：把自己踢回 waiting</text>
    <rect x="450" y="286" width="290" height="50" rx="6" fill="#fff" stroke="#3a9a52"/><text x="595" y="306">sched = 1，is_prefill = False</text><text x="595" y="325" font-size="11" fill="#555">may_append 按需领新块</text>
    <rect x="450" y="352" width="290" height="50" rx="6" fill="#fff" stroke="#3a9a52"/><text x="595" y="372">选中的 seq 按原顺序</text><text x="595" y="391" font-size="11" fill="#555">放回 running 队首（extendleft）</text>
    <rect x="450" y="418" width="290" height="36" rx="6" fill="#e2f5e6" stroke="#3a9a52"/><text x="595" y="441" font-weight="bold" fill="#1d5e2e">返回 (seqs, False)</text>
  </g>
  <g stroke="#555" stroke-width="1.3">
    <line x1="595" y1="124" x2="595" y2="137" marker-end="url(#a)"/>
    <line x1="595" y1="190" x2="595" y2="203" marker-end="url(#a)"/>
    <line x1="595" y1="270" x2="595" y2="283" marker-end="url(#a)"/>
    <line x1="595" y1="336" x2="595" y2="349" marker-end="url(#a)"/>
    <line x1="595" y1="402" x2="595" y2="415" marker-end="url(#a)"/>
  </g>
  <path d="M740,311 H762 V106 H743" fill="none" stroke="#3a9a52" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="770" y="210" font-size="11" fill="#1d5e2e" transform="rotate(90 770 210)" text-anchor="middle">下一个 seq</text>
  <text x="595" y="485" text-anchor="middle" font-size="11" fill="#555">一批里要么全是预填充，要么全是解码，不混合</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">MLA 的内容与 RoPE 位置通路</title>
  <desc id="desc">隐藏状态分成可低秩压缩的内容通路和位置相关的 RoPE 通路，缓存包含 KV latent 和小型 RoPE Key。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536d8b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:42px;font-weight:800;fill:#17233a}.sub{font-size:20px;fill:#56647a}.head{font-size:27px;font-weight:750;fill:#17233a}.label{font-size:20px;font-weight:700;fill:#263750}.small{font-size:17px;fill:#56647a}.panel{fill:#fff;stroke:#d2d9e3;stroke-width:2}.content{fill:#e8f1fb;stroke:#4b78a8;stroke-width:2}.position{fill:#fff0df;stroke:#b86e30;stroke-width:2}.cache{fill:#e9f4eb;stroke:#4c8a61;stroke-width:2}.line{stroke:#536d8b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="920" fill="#f7f8fa"/><text x="800" y="60" text-anchor="middle" class="title">解耦 RoPE：内容可压缩，位置单独保存</text><text x="800" y="98" text-anchor="middle" class="sub">每个历史 token 的缓存由两部分组成</text>
  <rect x="60" y="140" width="1480" height="650" rx="16" class="panel"/>
  <rect x="100" y="370" width="190" height="95" rx="10" class="content"/><text x="195" y="408" text-anchor="middle" class="label">隐藏状态 hⱼ</text><text x="195" y="438" text-anchor="middle" class="small">历史位置 j</text>
  <path d="M310 405C390 320 410 285 485 285" class="line"/><path d="M310 430C390 520 410 555 485 555" class="line"/>
  <text x="400" y="294" text-anchor="middle" class="small">内容通路</text><text x="400" y="572" text-anchor="middle" class="small">位置通路</text>
  <rect x="505" y="215" width="245" height="140" rx="12" class="content"/><text x="627" y="258" text-anchor="middle" class="label">联合下投影</text><text x="627" y="291" text-anchor="middle" class="head">cⱼᴷⱽ</text><text x="627" y="324" text-anchor="middle" class="small">共享低维内容 latent</text>
  <rect x="505" y="485" width="245" height="140" rx="12" class="position"/><text x="627" y="528" text-anchor="middle" class="label">位置 Key 投影</text><text x="627" y="561" text-anchor="middle" class="head">kⱼᴿ = Rⱼkⱼ</text><text x="627" y="594" text-anchor="middle" class="small">维度较小，带位置旋转</text>
  <path d="M770 285H905" class="line"/><path d="M770 555H905" class="line"/>
  <rect x="925" y="195" width="280" height="180" rx="12" class="cache"/><text x="1065" y="240" text-anchor="middle" class="label">KV Cache：内容部分</text><text x="1065" y="285" text-anchor="middle" class="head">[c₁ᴷⱽ ... cₜᴷⱽ]</text><text x="1065" y="328" text-anchor="middle" class="small">可利用投影吸收参与匹配与汇总</text>
  <rect x="925" y="465" width="280" height="180" rx="12" class="cache"/><text x="1065" y="510" text-anchor="middle" class="label">KV Cache：位置部分</text><text x="1065" y="555" text-anchor="middle" class="head">[k₁ᴿ ... kₜᴿ]</text><text x="1065" y="598" text-anchor="middle" class="small">保留每个位置不同的旋转结果</text>
  <path d="M1225 285H1330M1225 555H1330" class="line"/><rect x="1350" y="315" width="145" height="210" rx="12" class="content"/><text x="1422" y="368" text-anchor="middle" class="label">当前 Q</text><text x="1422" y="415" text-anchor="middle" class="small">内容分数</text><text x="1422" y="451" text-anchor="middle" class="head">+</text><text x="1422" y="488" text-anchor="middle" class="small">位置分数</text>
  <text x="800" y="735" text-anchor="middle" class="head">score(i,j) = qᶜᵢ · kᶜⱼ + qᴿᵢ · kᴿⱼ</text>
  <text x="800" y="850" text-anchor="middle" class="sub">RoPE 依赖位置 j，不能像统一线性上投影那样简单吸收到当前 Query 中</text>
</svg>

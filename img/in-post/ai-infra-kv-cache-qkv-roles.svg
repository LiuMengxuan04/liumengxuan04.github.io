<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Q、K、V 在 KV Cache 中的分工</title>
  <desc id="desc">Q 是当前查询，K 是历史位置的索引，V 是被加权汇总的内容。未来的 Query 会重复读取历史 K/V，而不会读取历史 Q。</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#315b8a"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4b8b61"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b36b2c"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #17233a; }
      .subtitle { font-size: 20px; fill: #536176; }
      .head { font-size: 28px; font-weight: 750; fill: #17233a; }
      .label { font-size: 20px; font-weight: 700; fill: #17233a; }
      .small { font-size: 17px; fill: #536176; }
      .tiny { font-size: 15px; fill: #536176; }
      .panel { fill: #ffffff; stroke: #cfd7e3; stroke-width: 2; }
      .q { fill: #e7f0fb; stroke: #4776a8; stroke-width: 2; }
      .k { fill: #e8f4ea; stroke: #4b8b61; stroke-width: 2; }
      .v { fill: #fff1df; stroke: #b36b2c; stroke-width: 2; }
      .old { fill: #f1f3f6; stroke: #aab5c2; stroke-width: 1.5; }
      .new { fill: #fbe9e7; stroke: #a74f4b; stroke-width: 2; }
      .blue-line { stroke: #315b8a; stroke-width: 2.5; fill: none; marker-end: url(#blue); }
      .green-line { stroke: #4b8b61; stroke-width: 2.5; fill: none; marker-end: url(#green); }
      .orange-line { stroke: #b36b2c; stroke-width: 2.5; fill: none; marker-end: url(#orange); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f8fa"/>
  <text x="800" y="62" text-anchor="middle" class="title">Q、K、V：当前问题、索引与内容</text>
  <text x="800" y="100" text-anchor="middle" class="subtitle">每个新 Query 都要访问历史 K/V；历史 Query 不会再出现在未来的注意力公式中</text>

  <rect x="55" y="145" width="1490" height="300" rx="18" class="panel"/>
  <text x="90" y="195" class="head">当前一步的注意力</text>

  <rect x="115" y="245" width="250" height="110" rx="14" class="q"/>
  <text x="240" y="282" text-anchor="middle" class="label">Q：当前查询 qₜ</text>
  <text x="240" y="314" text-anchor="middle" class="small">“我现在要找什么？”</text>
  <text x="240" y="340" text-anchor="middle" class="tiny">shape [1, Dₕ]</text>

  <path d="M385 300 H490" class="blue-line"/>
  <rect x="500" y="245" width="300" height="110" rx="14" class="k"/>
  <text x="650" y="282" text-anchor="middle" class="label">K：历史索引 K₁:ₜ</text>
  <text x="650" y="314" text-anchor="middle" class="small">“哪些位置与查询匹配？”</text>
  <text x="650" y="340" text-anchor="middle" class="tiny">qₜ K₁:ₜᵀ → 注意力分数</text>

  <path d="M820 300 H925" class="green-line"/>
  <rect x="935" y="245" width="300" height="110" rx="14" class="v"/>
  <text x="1085" y="282" text-anchor="middle" class="label">V：历史内容 V₁:ₜ</text>
  <text x="1085" y="314" text-anchor="middle" class="small">“匹配后要取回什么？”</text>
  <text x="1085" y="340" text-anchor="middle" class="tiny">Softmax 分数加权汇总</text>

  <path d="M1255 300 H1370" class="orange-line"/>
  <rect x="1380" y="255" width="115" height="90" rx="14" fill="#eee8f7" stroke="#7657a8" stroke-width="2"/>
  <text x="1437" y="291" text-anchor="middle" class="label">oₜ</text>
  <text x="1437" y="319" text-anchor="middle" class="small">上下文</text>

  <rect x="55" y="485" width="1490" height="345" rx="18" class="panel"/>
  <text x="90" y="535" class="head">为什么缓存 K/V，而不是缓存 Q？</text>

  <rect x="115" y="585" width="260" height="90" rx="12" class="new"/>
  <text x="245" y="620" text-anchor="middle" class="label">未来 Query</text>
  <text x="245" y="650" text-anchor="middle" class="small">qₜ₊₁、qₜ₊₂、…</text>

  <path d="M395 610 C470 570 520 570 590 610" class="green-line"/>
  <path d="M395 650 C470 690 520 690 590 650" class="orange-line"/>

  <rect x="610" y="565" width="260" height="110" rx="12" class="k"/>
  <text x="740" y="603" text-anchor="middle" class="label">KV Cache</text>
  <text x="740" y="632" text-anchor="middle" class="small">K₁:ₜ：反复匹配</text>
  <text x="740" y="658" text-anchor="middle" class="small">V₁:ₜ：反复读取</text>

  <path d="M890 620 H1010" class="blue-line"/>
  <rect x="1025" y="565" width="260" height="110" rx="12" class="v"/>
  <text x="1155" y="603" text-anchor="middle" class="label">每一步都需要</text>
  <text x="1155" y="632" text-anchor="middle" class="small">历史 K 与历史 V</text>
  <text x="1155" y="658" text-anchor="middle" class="small">所以必须持久化</text>

  <rect x="115" y="720" width="260" height="70" rx="12" class="old"/>
  <text x="245" y="748" text-anchor="middle" class="label" fill="#7c8796">历史 Q</text>
  <text x="245" y="773" text-anchor="middle" class="tiny">q₁、…、qₜ 已完成当前计算</text>
  <path d="M395 755 H1010" class="blue-line dash" opacity="0.55"/>
  <text x="700" y="748" text-anchor="middle" class="small" fill="#7c8796">未来注意力公式不读取历史 Q</text>
  <rect x="1025" y="720" width="260" height="70" rx="12" fill="#f1f3f6" stroke="#aab5c2" stroke-width="1.5"/>
  <text x="1155" y="748" text-anchor="middle" class="label" fill="#7c8796">无需 Q Cache</text>
  <text x="1155" y="773" text-anchor="middle" class="tiny">省下显存，也避免无意义的保存</text>

  <text x="800" y="870" text-anchor="middle" class="subtitle">可以把 Q 看成“提问者”，把 K/V 看成“可被反复检索的资料库”</text>
</svg>

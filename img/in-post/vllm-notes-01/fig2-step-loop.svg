<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="760" height="330" fill="#fff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">图 2　引擎的心跳：一次 step 做三件事</text>

  <rect x="40" y="90" width="190" height="110" rx="12" fill="#eef3ff" stroke="#4a6fd1" stroke-width="1.5"/>
  <text x="135" y="120" text-anchor="middle" font-weight="bold" fill="#223a80">① 调度</text>
  <text x="135" y="145" text-anchor="middle" font-size="12" fill="#444">这一步处理哪些请求？</text>
  <text x="135" y="164" text-anchor="middle" font-size="12" fill="#444">每个请求算几个 token？</text>
  <text x="135" y="183" text-anchor="middle" font-size="12" fill="#444">给它们分配 KV 块</text>

  <rect x="285" y="90" width="190" height="110" rx="12" fill="#f7f0ff" stroke="#8a5cc7" stroke-width="1.5"/>
  <text x="380" y="120" text-anchor="middle" font-weight="bold" fill="#5a2f94">② 前向计算</text>
  <text x="380" y="145" text-anchor="middle" font-size="12" fill="#444">把所有请求拼成一批</text>
  <text x="380" y="164" text-anchor="middle" font-size="12" fill="#444">在 GPU 上跑一遍模型</text>
  <text x="380" y="183" text-anchor="middle" font-size="12" fill="#444">每个请求采样 1 个 token</text>

  <rect x="530" y="90" width="190" height="110" rx="12" fill="#eefaf0" stroke="#3a9a52" stroke-width="1.5"/>
  <text x="625" y="120" text-anchor="middle" font-weight="bold" fill="#1d5e2e">③ 收尾</text>
  <text x="625" y="145" text-anchor="middle" font-size="12" fill="#444">把新 token 追加到请求</text>
  <text x="625" y="164" text-anchor="middle" font-size="12" fill="#444">检查是否该停止</text>
  <text x="625" y="183" text-anchor="middle" font-size="12" fill="#444">结束的请求释放 KV 块</text>

  <line x1="230" y1="145" x2="282" y2="145" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="475" y1="145" x2="527" y2="145" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M625,200 C625,280 135,280 135,203" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="380" y="298" text-anchor="middle" font-size="13" fill="#555">只要还有没完成的请求，就不停地重复；新请求可以在任意两次 step 之间加入</text>
</svg>

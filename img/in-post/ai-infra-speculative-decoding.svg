<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">投机解码的先猜后验流程</title><desc id="desc">小模型串行提出四个 token，大模型一次并行验证，接受连续前缀并在拒绝位置修正。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536d8b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:42px;font-weight:800;fill:#17233a}.sub{font-size:20px;fill:#56647a}.head{font-size:28px;font-weight:750;fill:#17233a}.label{font-size:20px;font-weight:700;fill:#263750}.small{font-size:17px;fill:#56647a}.panel{fill:#fff;stroke:#d2d9e3;stroke-width:2}.context{fill:#e8f1fb;stroke:#4b78a8;stroke-width:2}.draft{fill:#fff0df;stroke:#b86e30;stroke-width:2}.accept{fill:#e8f4ea;stroke:#4d8a61;stroke-width:2}.reject{fill:#f8e6e6;stroke:#a95858;stroke-width:2}.model{fill:#eee9f7;stroke:#7657a8;stroke-width:2}.line{stroke:#536d8b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="980" fill="#f7f8fa"/><text x="800" y="60" text-anchor="middle" class="title">Speculative Decoding：小模型先猜，大模型批量验证</text><text x="800" y="98" text-anchor="middle" class="sub">候选生成仍然因果串行；Target Verify 将多个候选位置组织成一次前向</text>
  <rect x="55" y="140" width="1490" height="220" rx="16" class="panel"/><text x="90" y="192" class="head">1. Draft：便宜地连续提出候选</text>
  <rect x="105" y="240" width="270" height="76" rx="10" class="context"/><text x="240" y="287" text-anchor="middle" class="label">上下文：“今天天气”</text><path d="M395 278H500" class="line"/><rect x="520" y="225" width="185" height="105" rx="10" class="model"/><text x="612" y="266" text-anchor="middle" class="label">Draft Model</text><text x="612" y="298" text-anchor="middle" class="small">较小、较快</text><path d="M725 278H820" class="line"/>
  <rect x="840" y="240" width="105" height="76" rx="9" class="draft"/><rect x="960" y="240" width="105" height="76" rx="9" class="draft"/><rect x="1080" y="240" width="105" height="76" rx="9" class="draft"/><rect x="1200" y="240" width="135" height="76" rx="9" class="draft"/><text x="892" y="287" text-anchor="middle" class="label">很</text><text x="1012" y="287" text-anchor="middle" class="label">适</text><text x="1132" y="287" text-anchor="middle" class="label">合</text><text x="1267" y="287" text-anchor="middle" class="label">散步</text><path d="M945 278H952M1065 278H1072M1185 278H1192" class="line"/><text x="1395" y="270" text-anchor="middle" class="small">逐 token</text><text x="1395" y="297" text-anchor="middle" class="small">生成草稿</text>
  <rect x="55" y="395" width="1490" height="235" rx="16" class="panel"/><text x="90" y="447" class="head">2. Verify：Target Model 一次计算多个条件分布</text>
  <rect x="105" y="500" width="270" height="76" rx="10" class="context"/><text x="240" y="547" text-anchor="middle" class="label">上下文 KV Cache</text><path d="M395 538H500" class="line"/><rect x="520" y="480" width="230" height="116" rx="10" class="model"/><text x="635" y="523" text-anchor="middle" class="label">Target Model</text><text x="635" y="555" text-anchor="middle" class="small">输入 k 个候选位置</text><text x="635" y="580" text-anchor="middle" class="small">因果 Mask 并行验证</text><path d="M770 538H835" class="line"/>
  <rect x="855" y="490" width="130" height="95" rx="9" class="accept"/><rect x="1000" y="490" width="130" height="95" rx="9" class="accept"/><rect x="1145" y="490" width="130" height="95" rx="9" class="accept"/><rect x="1290" y="490" width="160" height="95" rx="9" class="reject"/><text x="920" y="527" text-anchor="middle" class="label">“很”</text><text x="920" y="560" text-anchor="middle" class="label">接受 ✓</text><text x="1065" y="527" text-anchor="middle" class="label">“适”</text><text x="1065" y="560" text-anchor="middle" class="label">接受 ✓</text><text x="1210" y="527" text-anchor="middle" class="label">“合”</text><text x="1210" y="560" text-anchor="middle" class="label">接受 ✓</text><text x="1370" y="527" text-anchor="middle" class="label">“散步”</text><text x="1370" y="560" text-anchor="middle" class="label">拒绝 ✕</text>
  <rect x="55" y="665" width="1490" height="225" rx="16" class="panel"/><text x="90" y="717" class="head">3. Commit：只接受从开头连续通过的前缀</text>
  <rect x="165" y="770" width="130" height="78" rx="9" class="accept"/><rect x="315" y="770" width="130" height="78" rx="9" class="accept"/><rect x="465" y="770" width="130" height="78" rx="9" class="accept"/><text x="230" y="819" text-anchor="middle" class="label">很</text><text x="380" y="819" text-anchor="middle" class="label">适</text><text x="530" y="819" text-anchor="middle" class="label">合</text><path d="M615 809H750" class="line"/><rect x="770" y="755" width="300" height="108" rx="10" class="context"/><text x="920" y="797" text-anchor="middle" class="label">本轮推进 3 个 token</text><text x="920" y="830" text-anchor="middle" class="small">一次 Target Verify 换来连续前缀</text><path d="M1090 809H1200" class="line"/><rect x="1220" y="770" width="230" height="78" rx="9" class="reject"/><text x="1335" y="803" text-anchor="middle" class="label">拒绝处修正</text><text x="1335" y="831" text-anchor="middle" class="small">之后候选全部作废</text>
  <text x="800" y="945" text-anchor="middle" class="sub">加速来自“每次大模型调用平均推进几个 token”，而不是草稿长度本身</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">KV Cache 的显存占用与 MHA、GQA、MQA 对比</title>
  <desc id="desc">KV Cache 的容量随层数、batch、上下文长度、KV head 数和每个 head 维度线性增长。GQA 和 MQA 通过减少 KV head 数降低显存占用。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .title { font-size: 42px; font-weight: 800; fill: #17233a; }
    .subtitle { font-size: 20px; fill: #536176; }
    .head { font-size: 27px; font-weight: 750; fill: #17233a; }
    .label { font-size: 19px; font-weight: 700; fill: #17233a; }
    .small { font-size: 17px; fill: #536176; }
    .tiny { font-size: 15px; fill: #536176; }
    .panel { fill: #ffffff; stroke: #cfd7e3; stroke-width: 2; }
    .layer { fill: #e7f0fb; stroke: #4776a8; stroke-width: 2; }
    .k { fill: #e8f4ea; stroke: #4b8b61; stroke-width: 1.5; }
    .v { fill: #fff1df; stroke: #b36b2c; stroke-width: 1.5; }
    .mha { fill: #b9cceb; stroke: #4776a8; stroke-width: 2; }
    .gqa { fill: #c8e2cc; stroke: #4b8b61; stroke-width: 2; }
    .mqa { fill: #f4d2aa; stroke: #b36b2c; stroke-width: 2; }
  </style>

  <rect width="1600" height="950" fill="#f7f8fa"/>
  <text x="800" y="62" text-anchor="middle" class="title">KV Cache 的显存代价</text>
  <text x="800" y="100" text-anchor="middle" class="subtitle">上下文越长，缓存越大；KV head 越少，缓存越省</text>

  <rect x="55" y="145" width="1490" height="185" rx="18" class="panel"/>
  <text x="90" y="195" class="head">容量公式</text>
  <text x="800" y="216" text-anchor="middle" font-size="29" font-weight="700" fill="#5b21b6">M<tspan baseline-shift="sub" font-size="20">KV</tspan> = 2 × L × B × T × N<tspan baseline-shift="sub" font-size="20">KV</tspan> × D<tspan baseline-shift="sub" font-size="20">h</tspan> × bytes</text>
  <text x="800" y="270" text-anchor="middle" class="small">2 表示 K 和 V；L 是层数，B 是请求数，T 是上下文长度，NKV 是 KV head 数，Dh 是每个 head 的维度</text>
  <text x="800" y="300" text-anchor="middle" class="tiny">所有因素都是线性影响：batch 翻倍或上下文翻倍，KV Cache 都近似翻倍</text>

  <rect x="55" y="365" width="680" height="420" rx="18" class="panel"/>
  <text x="90" y="415" class="head">缓存如何随 token 追加？</text>
  <text x="90" y="448" class="small">每一层都有自己的 K Cache 和 V Cache，Decode 每步只增加一行</text>

  <rect x="105" y="505" width="125" height="78" rx="12" class="layer"/>
  <text x="167" y="538" text-anchor="middle" class="label">第 ℓ 层</text>
  <text x="167" y="565" text-anchor="middle" class="small">KV Cache</text>
  <path d="M250 544 H305" stroke="#315b8a" stroke-width="2.5" fill="none"/>

  <rect x="320" y="480" width="170" height="185" rx="12" fill="#f8fafc" stroke="#cfd7e3" stroke-width="2"/>
  <text x="405" y="510" text-anchor="middle" class="label">K Cache</text>
  <rect x="345" y="530" width="120" height="24" rx="4" class="k"/><text x="405" y="548" text-anchor="middle" class="tiny">k₁</text>
  <rect x="345" y="558" width="120" height="24" rx="4" class="k"/><text x="405" y="576" text-anchor="middle" class="tiny">k₂</text>
  <rect x="345" y="586" width="120" height="24" rx="4" class="k"/><text x="405" y="604" text-anchor="middle" class="tiny">… kₜ</text>
  <rect x="345" y="614" width="120" height="28" rx="4" class="mqa"/><text x="405" y="634" text-anchor="middle" class="tiny">+ kₜ₊₁</text>

  <rect x="515" y="480" width="170" height="185" rx="12" fill="#f8fafc" stroke="#cfd7e3" stroke-width="2"/>
  <text x="600" y="510" text-anchor="middle" class="label">V Cache</text>
  <rect x="540" y="530" width="120" height="24" rx="4" class="v"/><text x="600" y="548" text-anchor="middle" class="tiny">v₁</text>
  <rect x="540" y="558" width="120" height="24" rx="4" class="v"/><text x="600" y="576" text-anchor="middle" class="tiny">v₂</text>
  <rect x="540" y="586" width="120" height="24" rx="4" class="v"/><text x="600" y="604" text-anchor="middle" class="tiny">… vₜ</text>
  <rect x="540" y="614" width="120" height="28" rx="4" class="mqa"/><text x="600" y="634" text-anchor="middle" class="tiny">+ vₜ₊₁</text>

  <text x="405" y="715" text-anchor="middle" class="small">当前步：新增一行</text>
  <text x="600" y="715" text-anchor="middle" class="small">历史行继续被读取</text>

  <rect x="790" y="365" width="755" height="420" rx="18" class="panel"/>
  <text x="825" y="415" class="head">MHA、GQA、MQA：减少 KV head</text>
  <text x="825" y="448" class="small">示例：L=32，B=1，T=4096，Dh=128，FP16；MHA 取 Nh=32</text>

  <text x="850" y="520" class="label">MHA</text>
  <text x="850" y="545" class="tiny">NKV=32</text>
  <rect x="950" y="500" width="470" height="48" rx="8" class="mha"/>
  <text x="1435" y="531" text-anchor="end" class="label">2048 MiB</text>

  <text x="850" y="615" class="label">GQA</text>
  <text x="850" y="640" class="tiny">NKV=8</text>
  <rect x="950" y="595" width="118" height="48" rx="8" class="gqa"/>
  <text x="1435" y="626" text-anchor="end" class="label">512 MiB</text>

  <text x="850" y="710" class="label">MQA</text>
  <text x="850" y="735" class="tiny">NKV=1</text>
  <rect x="950" y="690" width="18" height="48" rx="5" class="mqa"/>
  <text x="1435" y="721" text-anchor="end" class="label">64 MiB</text>

  <text x="800" y="850" text-anchor="middle" class="subtitle">GQA/MQA 主要沿 head 维减少 K/V 的副本，因此能降低显存占用和 Decode 阶段的读取压力</text>
</svg>

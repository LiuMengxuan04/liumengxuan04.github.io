<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">8/3 倍中间维度：把参数预算配平</title><desc id="desc">忽略偏置和取整，标准 FFN 与 SwiGLU 总参数均为 8D²；SwiGLU 继续采用 4D 宽度则为 12D²。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#63758b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#23344d} .line{stroke:#63758b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<rect width="1200" height="490" fill="#f7f9fc"/>
<text x="600" y="48" text-anchor="middle" font-size="29" font-weight="bold">8/3 倍中间维度：把参数预算配平</text>
<text x="600" y="85" text-anchor="middle" font-size="17">横条宽度与参数量成正比；每个色块代表一个权重矩阵</text>
<text x="600" y="135" text-anchor="middle" font-size="21">标准 FFN：M = 4D</text>
<rect x="130" y="155" width="280" height="58" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="270.0" y="191.0" text-anchor="middle" font-size="20">Up：4D²</text>
<rect x="410" y="155" width="280" height="58" rx="12" fill="#e5f3ed" stroke="#bccbdf"/>
<text x="550.0" y="191.0" text-anchor="middle" font-size="20">Down：4D²</text>
<text x="750" y="191" text-anchor="middle" font-size="21">8D²</text>
<text x="600" y="250" text-anchor="middle" font-size="21">SwiGLU：M = 8D/3</text>
<rect x="130" y="270" width="186.66666666666666" height="58" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="223.33333333333331" y="306.0" text-anchor="middle" font-size="20">Gate：8D²/3</text>
<rect x="316.66666666666663" y="270" width="186.66666666666666" height="58" rx="12" fill="#e5f3ed" stroke="#bccbdf"/>
<text x="409.99999999999994" y="306.0" text-anchor="middle" font-size="20">Up：8D²/3</text>
<rect x="503.33333333333326" y="270" width="186.66666666666666" height="58" rx="12" fill="#f1eafa" stroke="#bccbdf"/>
<text x="596.6666666666666" y="306.0" text-anchor="middle" font-size="20">Down：8D²/3</text>
<text x="749.9999999999999" y="306" text-anchor="middle" font-size="21">8D²</text>
<text x="600" y="365" text-anchor="middle" font-size="21">SwiGLU：M = 4D</text>
<rect x="130" y="385" width="280" height="58" rx="12" fill="#e6effb" stroke="#bccbdf"/>
<text x="270.0" y="421.0" text-anchor="middle" font-size="20">Gate：4D²</text>
<rect x="410" y="385" width="280" height="58" rx="12" fill="#e5f3ed" stroke="#bccbdf"/>
<text x="550.0" y="421.0" text-anchor="middle" font-size="20">Up：4D²</text>
<rect x="690" y="385" width="280" height="58" rx="12" fill="#f1eafa" stroke="#bccbdf"/>
<text x="830.0" y="421.0" text-anchor="middle" font-size="20">Down：4D²</text>
<text x="1030" y="421" text-anchor="middle" font-size="21">12D²</text>
<text x="600" y="480" text-anchor="middle" font-size="21">同参数预算：2 × D × 4D = 3 × D × M  ⇒  M = 8D/3</text>
</svg>

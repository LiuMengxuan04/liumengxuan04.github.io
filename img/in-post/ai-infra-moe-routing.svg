<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">MoE：Router 选择少数 FFN 专家</title><desc id="desc">每个 token 由 Router 选择 Top-K 专家，专家输出按路由权重加权合并。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK JP","Microsoft YaHei",sans-serif;fill:#26364e} .b{stroke:#b8c9de;stroke-width:2} .a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)} .s{font-size:17px} .h{font-size:27px;font-weight:bold}</style><rect width="1200" height="610" fill="#f7f9fc"/><text x="600" y="45" text-anchor="middle" class="h">MoE：Router 选择少数 FFN 专家</text>
<rect x="470" y="75" width="260" height="65" rx="12" fill="#e8f1fb" class="b"/>
<text x="600.0" y="104.5" text-anchor="middle" font-size="20">token x</text>
<text x="600.0" y="131.5" text-anchor="middle" class="s">[d_model]</text>
<path d="M600 140V190" class="a"/>
<rect x="450" y="200" width="300" height="75" rx="12" fill="#ffe9c2" class="b"/>
<text x="600.0" y="234.5" text-anchor="middle" font-size="20">Router</text>
<text x="600.0" y="261.5" text-anchor="middle" class="s">softmax → Top-2</text>
<rect x="90" y="350" width="210" height="85" rx="12" fill="#e8f1fb" class="b"/>
<text x="195.0" y="389.5" text-anchor="middle" font-size="20">Expert 0</text>
<text x="195.0" y="416.5" text-anchor="middle" class="s">未选</text>
<rect x="380" y="350" width="210" height="85" rx="12" fill="#e5f3ed" class="b"/>
<text x="485.0" y="389.5" text-anchor="middle" font-size="20">Expert 1</text>
<text x="485.0" y="416.5" text-anchor="middle" class="s">权重 0.7</text>
<rect x="670" y="350" width="210" height="85" rx="12" fill="#e8f1fb" class="b"/>
<text x="775.0" y="389.5" text-anchor="middle" font-size="20">Expert 2</text>
<text x="775.0" y="416.5" text-anchor="middle" class="s">未选</text>
<rect x="960" y="350" width="210" height="85" rx="12" fill="#e5f3ed" class="b"/>
<text x="1065.0" y="389.5" text-anchor="middle" font-size="20">Expert 3</text>
<text x="1065.0" y="416.5" text-anchor="middle" class="s">权重 0.3</text>

<path d="M570 275L485 340" class="a"/>

<path d="M680 275L1065 340" class="a"/>
<rect x="430" y="500" width="340" height="70" rx="12" fill="#f1eafa" class="b"/>
<text x="600.0" y="532.0" text-anchor="middle" font-size="20">0.7 × E₁(x) + 0.3 × E₃(x)</text>
<text x="600.0" y="559.0" text-anchor="middle" class="s">输出 [d_model]</text>
<path d="M485 435L520 490" class="a"/>
<path d="M1065 435L680 490" class="a"/>
<text x="600" y="590" text-anchor="middle" font-size="18">只激活少数专家，但路由与分发本身仍有开销</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">FFN Kernel Fusion：让中间值留在片上</title><desc id="desc">把 SiLU 和逐元素乘法放进同一个 kernel，避免中间激活写回再读出。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK JP",sans-serif;fill:#26364e} .b{stroke:#b8c9de;stroke-width:2} .a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)} .s{font-size:17px} .h{font-size:27px;font-weight:bold}</style><rect width="1200" height="600" fill="#f7f9fc"/><text x="600" y="45" text-anchor="middle" class="h">FFN Kernel Fusion：让中间值留在片上</text>
<text x="300" y="95" text-anchor="middle" font-size="20">未融合：两个逐元素 kernel</text>
<rect x="70" y="135" width="180" height="65" rx="12" fill="#e8f1fb" class="b"/>
<text x="160.0" y="164.5" text-anchor="middle" font-size="20">G</text>
<text x="160.0" y="191.5" text-anchor="middle" class="s">读</text>
<rect x="300" y="135" width="180" height="65" rx="12" fill="#f1eafa" class="b"/>
<text x="390.0" y="164.5" text-anchor="middle" font-size="20">SiLU(G)</text>
<text x="390.0" y="191.5" text-anchor="middle" class="s">写 A</text>
<rect x="530" y="135" width="180" height="65" rx="12" fill="#f1eafa" class="b"/>
<text x="620.0" y="164.5" text-anchor="middle" font-size="20">A * U</text>
<text x="620.0" y="191.5" text-anchor="middle" class="s">读 A、U</text>
<rect x="760" y="135" width="180" height="65" rx="12" fill="#e8f1fb" class="b"/>
<text x="850.0" y="164.5" text-anchor="middle" font-size="20">H</text>
<text x="850.0" y="191.5" text-anchor="middle" class="s">写</text>
<path d="M250 167H290" class="a"/>
<path d="M480 167H520" class="a"/>
<path d="M710 167H750" class="a"/>
<text x="420" y="245" text-anchor="middle" font-size="17">A 被写入显存后又读回：多一次写入和一次读取</text>
<text x="300" y="330" text-anchor="middle" font-size="20">融合：一个 kernel</text>
<rect x="70" y="370" width="180" height="65" rx="12" fill="#e8f1fb" class="b"/>
<text x="160.0" y="399.5" text-anchor="middle" font-size="20">G</text>
<text x="160.0" y="426.5" text-anchor="middle" class="s">读</text>
<rect x="300" y="370" width="180" height="65" rx="12" fill="#e8f1fb" class="b"/>
<text x="390.0" y="399.5" text-anchor="middle" font-size="20">U</text>
<text x="390.0" y="426.5" text-anchor="middle" class="s">读</text>
<rect x="545" y="350" width="280" height="105" rx="12" fill="#e5f3ed" class="b"/>
<text x="685.0" y="399.5" text-anchor="middle" font-size="20">SiLU(G) → 寄存器 → × U</text>
<text x="685.0" y="426.5" text-anchor="middle" class="s">只写 H</text>
<rect x="900" y="370" width="180" height="65" rx="12" fill="#e8f1fb" class="b"/>
<text x="990.0" y="399.5" text-anchor="middle" font-size="20">H</text>
<text x="990.0" y="426.5" text-anchor="middle" class="s">写</text>
<path d="M250 402H530" class="a"/>
<path d="M480 402H530" class="a"/>
<path d="M825 402H890" class="a"/>
<text x="600" y="535" text-anchor="middle" font-size="18">逻辑上：从 G、A、U、A、H 的 5E 次访问降到 G、U、H 的 3E 次</text>
</svg>